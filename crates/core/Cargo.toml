# Configuration, constants, storage layout, the CLI, and the small pure utilities everything uses.
#
# **The first real crate boundary**, and it exists so the dependency direction is a fact the compiler checks
# rather than a convention. Nothing here may name a layer above it - not the analytics or transactional
# services, not the pricing service, not the topic vocabulary - and until this crate existed `core` re-exported
# all of them "for backward compatibility", so `cargo tree` said nothing true.
#
# No drivers: no `duckdb`, `sqlx`, `clickhouse`, `aws-sdk-*`, `rdkafka`, `redis`, `axum`, `tonic` or `moka`.
# A violation does not compile, which is the point - there is no list to maintain and no macro or re-export
# that can defeat it.
[package]
name = "sideseat-core"
version = "1.0.13"
edition = "2024"
rust-version.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
directories = { workspace = true }
dirs = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
ipnet = "2.12.1"
local-ip-address = { workspace = true }
opentelemetry-proto = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
supports-hyperlinks = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
