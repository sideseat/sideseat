[workspace]
members = ["server", "sdk/rust"]
resolver = "2"

# ---------------------------------------------------------------------------
# Lint gates
#
# Levels are hand-picked rather than family-wide: a gate is only useful if a green
# result means something, and a family that fires 4000 times on style gets muted or
# worked around instead of fixed. Each `deny` below is a bug class that is currently at
# zero, so it can only be reintroduced deliberately. Each `allow` says why.
# ---------------------------------------------------------------------------
[workspace.lints.rust]
# Removes memory-unsafety as a class from shipped code. `deny` rather than `forbid`
# because the test modules need a documented, local override: Rust 2024 made
# env::set_var/remove_var unsafe, and there is no safe equivalent for a test that has to
# set an env var. Non-test code has zero unsafe blocks and this keeps it that way.
unsafe_code = "deny"
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_mut = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -2 }

# --- bug classes held at zero ---
# A lock guard living for a whole match arm: safe today, deadlocks the moment an arm
# grows an .await or a second lock.
significant_drop_in_scrutinee = "deny"
# Side effects inside debug_assert! - behaviour that differs between debug and release.
debug_assert_with_mut_call = "deny"
# A doc comment separated from its item by a blank line documents the wrong thing.
empty_line_after_doc_comments = "deny"
empty_line_after_outer_attr = "deny"
derive_partial_eq_without_eq = "deny"
# Panic paths that a Result would carry instead.
unwrap_in_result = "deny"

# --- advisory: real but non-blocking ---
# `allow` here, not `warn`, because the gate is `clippy --all-targets -- -D warnings`:
# a `warn` at workspace level becomes a hard error there, and these ~156 findings would
# fail every `make lint` run. Run `make lint-advisory` to see them; it enables exactly
# this list with `-W`, so the set stays in one place.
#
# Counts at the time of writing: significant_drop_tightening 95, redundant_clone 18,
# needless_collect 15, or_fun_call 14, useless_let_if_seq 4, future_not_send 4,
# trait_duplication_in_bounds 2, single_option_map 2, suboptimal_flops 1,
# branches_sharing_code 1.
redundant_clone = "allow"
needless_collect = "allow"
or_fun_call = "allow"
useless_let_if_seq = "allow"
significant_drop_tightening = "allow"
branches_sharing_code = "allow"
suboptimal_flops = "allow"
trait_duplication_in_bounds = "allow"
single_option_map = "allow"
# 4 sites in the async cache/topics layer; making those futures Send is a design change,
# not a lint fix.
future_not_send = "allow"

# --- style families deliberately not enabled ---
# pedantic fires ~4100 times and nursery ~600 on this tree, almost entirely on style
# (missing_const_for_fn, use_self, option_if_let_else, redundant_pub_crate). Turning
# them on wholesale would bury the denies above in noise.
#
# multiple_crate_versions (170) and cargo_common_metadata come from the transitive
# dependency graph and cannot be resolved from this workspace.
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
# Braces in user-facing strings are literal - they document URL templates like
# /{entity_type}/{entity_id}, they are not unformatted arguments.
literal_string_with_formatting_args = "allow"
# The CRDT document mutators take &mut self on purpose: yrs uses interior mutability, so
# the compiler would otherwise permit concurrent mutation through shared references.
needless_pass_by_ref_mut = "allow"

[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1.49", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = [
  "fs",
  "cors",
  "trace",
  "decompression-gzip",
  "compression-gzip",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sqlx = { version = "0.8.6", features = [
  "runtime-tokio-rustls",
  "sqlite",
  "postgres",
  "migrate",
] }
config = "0.15"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.5", features = ["derive", "env"] }
rust-embed = { version = "8.8", features = ["compression"] }
reqwest = { version = "0.13", features = [
  "json",
  "stream",
  "rustls",
  "multipart",
  "form",
], default-features = false }
async-stream = "0.3"
async-trait = "0.1"
futures = "0.3"
thiserror = "2.0"
anyhow = "1.0"
mime_guess = "2.0"
directories = "6.0.0"
dirs = "6.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
keyring = { version = "3.6", default-features = false, features = [
  "apple-native",
  "windows-native",
  "crypto-rust",
] }
# Note: linux-native and sync-secret-service removed for cross-compilation.
# Linux uses file-based secrets by default. Set SIDESEAT_SECRETS_BACKEND=file.
local-ip-address = "0.6"
supports-hyperlinks = "3"
jsonwebtoken = "9"
rand = "0.8"
subtle = "2"
axum-extra = { version = "0.10", features = ["cookie"] }
uuid = { version = "1.11", features = ["v4"] }
time = "0.3"

# OpenTelemetry dependencies
opentelemetry        = { version = "0.28", features = ["trace"] }
opentelemetry_sdk    = { version = "0.28", features = ["rt-tokio", "trace", "metrics"] }
opentelemetry-otlp   = { version = "0.28", features = ["trace", "metrics", "http-proto", "reqwest-client"] }
opentelemetry-proto = { version = "0.28", features = [
  "trace",
  "metrics",
  "logs",
  "gen-tonic-messages",
  "gen-tonic",
  "with-serde",
] }
prost = "0.13"
tonic = { version = "0.12", features = ["transport"] }
tokio-stream = { version = "0.1", features = ["sync"] }
base64 = "0.22"
hex = "0.4"
regex = "1.11"
fs2 = "0.4"
sha2 = "0.10"
blake3 = "1"
hmac = "0.12"
dashmap = "6.1"
duckdb = { version = "1.10503.1", features = ["bundled", "json", "vtab"] }
parking_lot = "0.12"
rustc-hash = "2.1"
validator = { version = "0.20", features = ["derive"] }
cuid2 = "0.1"
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
semver = "1.0"

# AWS SDKs
aws-sdk-s3 = "1.87"
aws-sdk-secretsmanager = "1"
aws-sdk-bedrockruntime = "1"
aws-sdk-bedrock = "1"
aws-credential-types = "1"
aws-config = { version = "1.7", features = ["behavior-version-latest"] }
gcp_auth = "0.12"

# Cache (moka for in-memory, deadpool-redis for Redis)
moka = { version = "0.12", features = ["future", "sync"] }
rmp-serde = "1"
md5 = "0.7"
deadpool-redis = "0.18"

# ClickHouse client
clickhouse = { version = "0.14", features = ["lz4", "time"] }

# MCP server
rmcp = { version = "3.1", features = ["server", "client", "macros", "transport-streamable-http-server"] }
schemars = "1.0"
tokio-util = { version = "0.7", features = ["rt"] }
security-framework = { version = "3", features = ["OSX_10_15"] }
core-foundation = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.release.package."*"]
opt-level = 3
