[workspace]
members = [
  "server/crates/adapter-blob-storage",
  "server/crates/adapter-cache",
  "server/crates/adapter-clickhouse",
  "server/crates/adapter-duckdb",
  "server/crates/adapter-postgres",
  "server/crates/adapter-pricing",
  "server/crates/adapter-provider-probe",
  "server/crates/adapter-registrations-memory",
  "server/crates/adapter-secrets",
  "server/crates/adapter-sqlite",
  "server/crates/adapter-topics",
  "server/crates/api",
  "server/crates/core",
  "server/crates/domain",
  "server/crates/ingestion",
  "server/crates/messaging",
  "server/crates/ports",
  "server/crates/query-sql",
  "server/crates/rule-assets",
  "server",
  "sdk/rust",
  "server/crates/workspace-hack",
]
resolver = "2"

# Keep the exact patch version: resolved AWS crates require 1.94.1. `make msrv` builds the
# workspace on this floor, and Clippy checks source APIs against it. Re-measure
# dependency requirements after lockfile updates with:
#   cargo metadata --locked --format-version 1 |
#     python3 -c 'import json,sys; print(max((p["rust_version"] for p in json.load(sys.stdin)["packages"] if p.get("rust_version")), key=lambda v: tuple(int(x) for x in v.split("."))))'
[workspace.package]
# Every workspace crate inherits this version so binary metadata, the banner,
# and update checks cannot drift. `make sync-version` updates it.
version = "1.0.13"
rust-version = "1.94.1"

# ---------------------------------------------------------------------------
# Lint gates
#
# Selected bug classes are denied explicitly. Advisory and style lints remain
# opt-in below so the blocking gate stays actionable.
# ---------------------------------------------------------------------------
[workspace.lints.rust]
# Requires unsafe code to opt in at a documented module boundary. `deny` rather than
# `forbid` permits the counting allocator's `GlobalAlloc` delegation. Unsafe code
# elsewhere fails the lint.
unsafe_code = "deny"
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_mut = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -2 }

# --- bug classes held at zero ---
# A lock guard living for a whole match arm: safe today, deadlocks the moment an arm
# grows an .await or a second lock.
significant_drop_in_scrutinee = "deny"
# Side effects inside debug_assert! - behaviour that differs between debug and release.
debug_assert_with_mut_call = "deny"
# A doc comment separated from its item by a blank line documents the wrong thing.
empty_line_after_doc_comments = "deny"
empty_line_after_outer_attr = "deny"
derive_partial_eq_without_eq = "deny"
# Panic paths that a Result would carry instead.
unwrap_in_result = "deny"

# --- advisory: real but non-blocking ---
# These are `allow`, not `warn`, because the blocking gate promotes every
# warning to an error. `make lint-advisory` enables this same list explicitly.
redundant_clone = "allow"
needless_collect = "allow"
or_fun_call = "allow"
useless_let_if_seq = "allow"
significant_drop_tightening = "allow"
branches_sharing_code = "allow"
suboptimal_flops = "allow"
trait_duplication_in_bounds = "allow"
single_option_map = "allow"
# Cache and topic abstractions permit non-Send futures by design.
future_not_send = "allow"

# --- style families deliberately not enabled ---
# Pedantic and nursery remain opt-in because family-wide style findings would
# obscure the bug-class gate.
#
# Duplicate versions come from the resolved dependency graph; cargo metadata
# requirements are not useful for unpublished workspace crates.
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
# Braces in user-facing strings are literal - they document URL templates like
# /{entity_type}/{entity_id}, they are not unformatted arguments.
literal_string_with_formatting_args = "allow"
# The CRDT document mutators take &mut self on purpose: yrs uses interior mutability, so
# the compiler would otherwise permit concurrent mutation through shared references.
needless_pass_by_ref_mut = "allow"

[workspace.dependencies]
# cargo-hakari: one feature set per third-party dependency (server/crates/workspace-hack).
sideseat-workspace-hack = { path = "server/crates/workspace-hack" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1.49", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = [
  "fs",
  "cors",
  "trace",
  "decompression-gzip",
  "compression-gzip",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sqlx = { version = "0.8.6", features = [
  "runtime-tokio-rustls",
  "sqlite",
  "postgres",
  "migrate",
] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.5", features = ["derive", "env"] }
rust-embed = { version = "8.8", features = ["compression"] }
reqwest = { version = "0.13", features = [
  "json",
  "stream",
  "rustls",
  "multipart",
  "form",
], default-features = false }
async-stream = "0.3"
async-trait = "0.1"
futures = "0.3"
thiserror = "2.0"
anyhow = "1.0"
# One declaration of an enum's string form serves every direction: `&'static str`, `Display`, `FromStr`.
# Already in the lock through duckdb, so it costs no extra compilation.
strum = { version = "0.27", features = ["derive"] }
mime_guess = "2.0"
directories = "6.0.0"
dirs = "6.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
keyring = { version = "3.6", default-features = false, features = [
  "apple-native",
  "windows-native",
  "crypto-rust",
] }
# Native keyring integrations are limited to Apple and Windows so Linux remains
# cross-compilable and defaults to file-backed secrets.
local-ip-address = "0.6"
supports-hyperlinks = "3"
jsonwebtoken = "9"
rand = "0.8"
subtle = "2"
axum-extra = { version = "0.10", features = ["cookie"] }
uuid = { version = "1.11", features = ["v4"] }
time = "0.3"

# OpenTelemetry dependencies
opentelemetry        = { version = "0.33", features = ["trace"] }
opentelemetry_sdk    = { version = "0.33", features = ["rt-tokio", "trace", "metrics"] }
opentelemetry-otlp   = { version = "0.33", default-features = false, features = ["trace", "metrics", "http-proto", "reqwest-blocking-client"] }
opentelemetry-proto = { version = "0.28", features = [
  "trace",
  "metrics",
  "logs",
  "gen-tonic-messages",
  "gen-tonic",
  "with-serde",
] }
prost = "0.13"
zstd = "0.13"
tonic = { version = "0.14", features = ["transport"] }
base64 = "0.22"
hex = "0.4"
regex = "1.11"
sha2 = "0.10"
blake3 = "1"
# Borrowed RFC 9535 matches preserve provider member order during framework-rule
# selection. See `docs/engineering/framework-rules-engine.md`.
serde_json_path = "0.7"
hmac = "0.12"
dashmap = "6.1"
duckdb = { version = "1.10506.0", features = ["bundled", "json", "vtab"] }
parking_lot = "0.12"
rustc-hash = "2.1"
validator = { version = "0.20", features = ["derive"] }
cuid2 = "0.1"
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
semver = "1.0"

# AWS SDKs. Default features are off because they include `rustls`, the legacy hyper 0.14 / h2 0.3 /
# rustls 0.21 client that carries RUSTSEC-2026-0258, -0098, -0099 and -0104; `default-https-client` is the
# hyper 1 / rustls 0.23 one, and the only client these crates need.
aws-sdk-s3 = { version = "1.87", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-sdk-secretsmanager = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-bedrockruntime = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-bedrock = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-credential-types = "1"
aws-config = { version = "1.7", features = ["behavior-version-latest"] }
gcp_auth = "0.12"

# Cache (moka for in-memory, deadpool-redis for Redis)
moka = { version = "0.12", features = ["future", "sync"] }
rmp-serde = "1"
rdkafka = { version = "0.39.0", features = ["cmake-build"] }
deadpool-redis = "0.18"

# ClickHouse client
clickhouse = { version = "0.14", features = ["lz4", "time"] }

# MCP server
rmcp = { version = "3.1", features = ["server", "client", "macros", "transport-streamable-http-server"] }
schemars = "1.0"
tokio-util = { version = "0.7", features = ["rt"] }

[profile.dev]
# No debug info in the inner loop. On macOS the default `split-debuginfo = "unpacked"` leaves every
# codegen unit's object file beside the binary for the debugger, and incremental rebuilds never delete
# the superseded ones, so the target grows without bound. A panic still reports its file and line.
# Debug with `--profile debugging`.
debug = false
# The test suites replay a large captured telemetry corpus. Unoptimized code made them about ten times
# slower while an incremental rebuild costs about the same at this level.
opt-level = 2

# Full debug info for a debugger session: `cargo build --profile debugging`. Cargo builds it into
# its own `target/debugging`, so it never invalidates the inner loop's artifacts.
[profile.debugging]
inherits = "dev"
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# The release build with symbols, for profilers. Same optimisation as release so a flamegraph describes the
# code that ships; thin LTO because the profile is rebuilt while iterating.
[profile.profiling]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = false
debug = "line-tables-only"
# Packed: the line tables go into a .dSYM beside the binary. Unpacked, the macOS default, keeps every codegen
# unit's object file in deps for the debugger, and rebuilds never remove the superseded ones.
split-debuginfo = "packed"
