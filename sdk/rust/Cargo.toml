[package]
name = "sideseat"
version = "0.3.0"
edition = "2024"
rust-version.workspace = true
description = "OpenTelemetry for AI agents, configured for SideSeat in one call"
# Published client SDKs use MIT; server and CLI artifacts use Apache-2.0.
license = "MIT"
repository = "https://github.com/sideseat/sideseat"
homepage = "https://sideseat.ai"
documentation = "https://sideseat.ai/docs/sdks/rust/"
keywords = ["ai", "llm", "opentelemetry", "tracing", "observability"]
categories = ["development-tools::debugging", "development-tools::profiling"]
readme = "README.md"

[dependencies]
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["logs"] }
opentelemetry-otlp = { workspace = true, features = ["logs"] }
thiserror = { workspace = true }
percent-encoding = "2"
url = "2"

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["logs", "testing"] }
tokio = { workspace = true }

[lints]
workspace = true
