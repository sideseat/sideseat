[project]
name = "sideseat"
dynamic = ["version"]
description = "OpenTelemetry for AI agents: traces, sessions, and conversations in SideSeat"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "SideSeat", email = "support@sideseat.ai" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
keywords = ["opentelemetry", "observability", "llm", "agents", "tracing", "genai"]

# A wide floor on purpose: frameworks cap OpenTelemetry themselves (Logfire below 1.45, Google ADK at
# 1.42.1), and the SDK must install alongside each of them.
dependencies = [
    "opentelemetry-api>=1.39",
    "opentelemetry-sdk>=1.39",
    "opentelemetry-exporter-otlp-proto-http>=1.39",
]

# One extra per integration that needs packages beyond the framework itself. Integrations whose
# framework emits OpenTelemetry natively (strands, google-adk, agent-framework, semantic-kernel,
# claude-agent-sdk, langflow) need no extra.
[project.optional-dependencies]
langchain = ["openinference-instrumentation-langchain>=0.1.78"]
langgraph = ["openinference-instrumentation-langchain>=0.1.78"]
crewai = ["openinference-instrumentation-crewai>=1.1.20"]
autogen = ["openinference-instrumentation-autogen-agentchat>=0.1.21"]
agno = ["openinference-instrumentation-agno>=1.0.13"]
smolagents = ["openinference-instrumentation-smolagents>=0.1.42"]
llama-index = ["openinference-instrumentation-llama-index>=4.5.4"]
azure-openai = ["openinference-instrumentation-openai>=0.1.63"]
ag2 = ["ag2[tracing]>=1.1.1"]
agentscope = ["agentscope>=2.0.9"]
haystack = ["opentelemetry-haystack>=1.0.0"]
traceloop = ["traceloop-sdk>=0.62.4"]
# 4.16 requires OpenTelemetry 1.45, which Logfire 5.1 does not yet accept; 4.15.6 is the newest release
# that installs beside every other extra.
langfuse = ["langfuse>=4.15.6"]
browser-use = ["lmnr>=0.7.64"]
logfire = ["logfire>=5.1.1"]
openai-agents = ["logfire>=5.1.1"]
pydantic-ai = ["logfire>=5.1.1"]
openai = ["logfire>=5.1.1"]
anthropic = ["logfire>=5.1.1"]
google-genai = ["logfire[google-genai]>=5.1.1"]
vertex-ai = ["logfire[google-genai]>=5.1.1"]
bedrock = ["wrapt>=1.14"]
# The runtime channel: agent presence, introspection, and invocation from the SideSeat UI.
runtime = ["websockets>=17", "rich>=15", "ag-ui-protocol>=1.0"]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.0",
    "ruff>=0.16",
    "mypy>=2.4",
    "wrapt>=1.14",
    "botocore>=1.43",
    "websockets>=17",
    "rich>=15",
    "ag-ui-protocol>=1.0",
]

[project.urls]
Homepage = "https://sideseat.ai"
Documentation = "https://sideseat.ai/docs/sdks/python/"
Repository = "https://github.com/sideseat/sideseat"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = "==0.12.13"
# Laminar and TraceLoop pin incompatible OpenTelemetry semantic-convention packages, so one
# environment can hold either, not both.
conflicts = [[{ extra = "browser-use" }, { extra = "traceloop" }]]

[tool.hatch.version]
path = "src/sideseat/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sideseat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:sideseat"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Separate `with` blocks keep "set up telemetry" and "do the work under test" visibly apart.
"tests/**" = ["SIM117"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# Optional framework dependencies: imported only inside the integration that needs them.
module = [
    "ag_ui.*",
    "ag_ui_strands.*",
    "agent_framework.*",
    "botocore.*",
    "claude_agent_sdk.*",
    "google.adk.*",
    "langfuse.*",
    "lmnr.*",
    "logfire.*",
    "rich.*",
    "strands.*",
    "traceloop.*",
    "websockets.*",
    "wrapt",
]
ignore_missing_imports = true
