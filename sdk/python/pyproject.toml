[project]
name = "sideseat"
dynamic = ["version"]
description = "Debug, trace, and understand your AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "SideSeat", email = "support@sideseat.ai" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
keywords = ["opentelemetry", "observability", "llm", "ai", "tracing", "telemetry"]

dependencies = [
    "opentelemetry-api>=1.39.0",
    "opentelemetry-sdk>=1.39.0",
    "opentelemetry-exporter-otlp-proto-http>=1.39.0",
]

[project.optional-dependencies]
# Framework-specific instrumentation
langchain = ["openinference-instrumentation-langchain>=0.1.0"]
langgraph = ["openinference-instrumentation-langchain>=0.1.0"]
crewai = ["openinference-instrumentation-crewai>=0.1.0"]
agno = ["openinference-instrumentation-agno>=0.1.0"]
smolagents = ["openinference-instrumentation-smolagents>=0.1.0"]
# AG2 is the community AutoGen fork; its OpenInference instrumentor is the `autogen` one.
ag2 = ["openinference-instrumentation-autogen>=0.1.0"]
haystack = ["openinference-instrumentation-haystack>=0.1.0"]
autogen = ["openinference-instrumentation-autogen-agentchat>=0.1.0"]
# logfire>=4.29.0 added instrument_openai_agents() using the official SDK hook
openai-agents = ["logfire>=4.29.0"]
pydantic-ai = ["logfire>=4.29.0"]
openai = ["logfire>=4.29.0"]
# httpx: anthropic >= 1.0 switched its HTTP client to httpx2, but logfire's Anthropic
# integration still imports httpx at module level (for httpx.Headers()), so without
# this the import fails, instrument() only logs a warning and no spans are produced.
# logfire patches the Anthropic client's own _request method, so the underlying HTTP
# library does not otherwise matter. Only the Anthropic integration needs this - the
# openai one has no module-level httpx import.
anthropic = ["logfire>=4.29.0", "httpx>=0.27"]
google-genai = ["logfire>=4.29.0"]
vertex-ai = ["opentelemetry-instrumentation-vertexai>=0.40.0"]

# Cloud provider instrumentation
aws = ["wrapt>=1.14.0"]

# Persistent WebSocket bridge (presence + introspection)
ws = ["websockets>=12"]

# AG-UI run-agent invoke flow + console renderer. Sample projects that
# wire a Strands agent through SideSeat add `ag_ui_strands` themselves
# (it pulls in fastapi); we don't pin it on the core SDK so non-Strands
# users don't pay for unrelated deps.
agui = ["rich>=13", "ag-ui-protocol>=0.1.18"]

# Bundle all instrumentation extras
# Union of every framework/provider extra plus the runtime channel. Keep in sync when
# adding an extra: test_all_extra_is_complete asserts this is a superset of the rest.
all = [
    "openinference-instrumentation-langchain>=0.1.0",
    "openinference-instrumentation-crewai>=0.1.0",
    "openinference-instrumentation-autogen-agentchat>=0.1.0",
    "openinference-instrumentation-autogen>=0.1.0",
    "openinference-instrumentation-agno>=0.1.0",
    "openinference-instrumentation-smolagents>=0.1.0",
    "openinference-instrumentation-haystack>=0.1.0",
    "opentelemetry-instrumentation-vertexai>=0.40.0",
    "logfire>=4.29.0",
    "httpx>=0.27",
    "wrapt>=1.14.0",
    "websockets>=12",
    "rich>=13",
    "ag-ui-protocol>=0.1.18",
]

# Development dependencies
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.urls]
Homepage = "https://sideseat.ai"
Documentation = "https://sideseat.ai/docs"
Repository = "https://github.com/sideseat/sideseat"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/sideseat/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sideseat"]

# =============================================================================
# Testing
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]

# =============================================================================
# Ruff (formatting + linting)
# =============================================================================

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# =============================================================================
# MyPy (type checking)
# =============================================================================

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "agent_framework.*",
    "ag_ui.*",
    "ag_ui_strands.*",
    "opentelemetry.instrumentation.vertexai",
    "logfire.*",
    "rich.*",
    "strands.*",
    "websockets.*",
    "wrapt",
]
ignore_missing_imports = true
