[project]
# The advisory scanner, in its own **locked** environment.
#
# `uv run --with pip-audit==2.10.1` pins the tool and not its dependencies: uv resolves that environment fresh
# on every run, so an unchanged commit could be audited by different code - the same nondeterminism the Cargo
# tools were pinned for, one level down. A project with a lockfile makes the whole environment a fact of this
# repository.
name = "sideseat-audit-tools"
version = "0.1.0"
description = "Locked environment for the advisory scanner CI runs"
requires-python = ">=3.10"
dependencies = ["pip-audit==2.10.1"]

[tool.uv]
package = false
