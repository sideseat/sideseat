[project]
name = "telemetry-common"
version = "0.1.0"
description = "Shared utilities for SideSeat telemetry samples"
requires-python = ">=3.12,<3.14"
dependencies = [
    "boto3>=1.35",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    # Allow wide range so each framework can pin its own preferred version
    "python-dotenv>=0.19.0",
    "sideseat",
]

[project.optional-dependencies]
# Clients for Bedrock's compatible endpoints (common/bedrock_openai.py). Split by
# provider so a suite installs only the SDK it uses: agent-framework-anthropic pins
# anthropic<1, which cannot coexist with the >=1.0 the Anthropic-compatible client needs,
# and a suite that only talks to the OpenAI-compatible endpoint should not be dragged into
# that conflict.
bedrock-openai = ["openai>=2.0", "httpx2>=2.0"]
bedrock-anthropic = ["anthropic>=1.0", "httpx2>=2.0"]
# Convenience bundle for suites that use both.
bedrock-compat = ["openai>=2.0", "anthropic>=1.0", "httpx2>=2.0"]

[tool.uv.sources]
sideseat = { path = "../../../../sdk/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]
