# The historical Genkit for Go releases this suite is replayed against; see `python -m harness matrix --help`
# and docs/engineering/framework-versions.md. Genkit writes its own spans, so its release history is the window.
[matrix]
package = "github.com/firebase/genkit/go"
since = "2025-10-05"
resolved-before = "2026-10-05T00:00:00Z"
probes = ["tool_use", "streaming"]
scenarios = ["tool_use", "streaming"]

# Each variant is the newest release of one telemetry class in `versions.census.json`.
[[variant]]
version = "1.12.0"
doc = "1.12.0: the earliest release whose Google AI plugin takes a BaseURL, which points the suite at the fake Gemini server; its model calls also produce otelhttp HTTP client spans and genkit util spans."

[[variant]]
version = "1.13.1"
current = true
doc = "1.13 onwards: no HTTP client or util spans. The suite's locked release; its fixtures are the ordinary capture."

[[exempt]]
version = "1.1.0"
reason = "The Google AI plugin has no BaseURL option before 1.12, so the suite cannot point it at the fake Gemini server it runs against."
revisit = "2027-01-05"

