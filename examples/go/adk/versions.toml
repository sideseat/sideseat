# The historical Google ADK for Go releases this suite is replayed against; see `python -m harness matrix --help`
# and docs/engineering/framework-versions.md. ADK writes its own spans and log events, so its release history
# is the window.
[matrix]
package = "google.golang.org/adk"
since = "2025-10-05"
resolved-before = "2026-10-05T00:00:00Z"
probes = ["tool_use", "streaming"]
scenarios = ["tool_use", "streaming"]

# Every runnable release of the window emits the format of the suite's own.
[[variant]]
version = "1.8.0"
current = true
doc = "1.7.0 onwards: one format. The suite's locked release; its fixtures are the ordinary capture."

[[exempt]]
version = "0.1.0"
reason = "Predates the telemetry.New / WithLoggerProvider setup API the suite configures ADK's telemetry with."
