# The historical Koog releases this suite is replayed against; see `python -m harness matrix --help` and
# docs/engineering/framework-versions.md. Koog's OpenTelemetry feature writes the spans, so its release history
# is the window.
[matrix]
package = "ai.koog:koog-agents"
pin = "koog={version}"
since = "2025-10-05"
resolved-before = "2026-10-05T00:00:00Z"
probes = ["tool_use", "chat"]
scenarios = ["tool_use", "chat"]

# Only the suite's own release runs it.
[[variant]]
version = "1.3.0"
current = true
doc = "1.3.0: the only runnable release. The suite's locked release; its fixtures are the ordinary capture."

[[exempt]]
version = "0.5.1"
reason = "Its OpenTelemetry feature keeps SpanAdapter internal, which the suite extends to stamp the session on every span."
revisit = "2027-01-05"

