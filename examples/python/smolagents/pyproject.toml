[project]
name = "example-smolagents"
version = "0.0.0"
description = "Smolagents scenarios for SideSeat"
requires-python = ">=3.11"
dependencies = [
    "smolagents[bedrock,litellm]>=1.26.0",
    # Without the floor the resolver picks an old LiteLLM whose tokenizers has no wheel for current Python.
    "litellm>=1.103.2",
    "openinference-instrumentation-smolagents>=0.1.42",
    "sideseat[smolagents]",
    "sideseat-example-harness[bedrock]",
]

[tool.sideseat-example]
producer = "smolagents"
integrations = ["smolagents"]

# How smolagents reports what the model asked for, for the truth derivation (`python -m harness truth`):
# the agent answers through its `final_answer` tool, and the tool's span reports the answer as its result.
# A model answering in text - the call written as a JSON action, or plain prose - is answered through
# the same tool, which smolagents runs itself.
[tool.sideseat-example.truth]
action_results = { final_answer = ["answer"] }
text_answer_action = { tool = "final_answer", argument = "answer" }
# `max_steps` allows one step (the scenario's `max_steps=1`); smolagents then asks for the answer in a call of
# its own, without tools, sending its final-answer prompt after the steps' history.
step_limits = { max_steps = 1 }

[[tool.sideseat-example.truth.framework_prompts]]
template = "Based on the above, please provide an answer to the following user task:\n{task}"
source = "smolagents 1.26.0, prompts/toolcalling_agent.yaml:240 (final_answer.post_messages), sent by MultiStepAgent.provide_final_answer"
scenarios = ["max_steps"]

[tool.uv]
required-version = "==0.12.13"
package = false

[tool.uv.sources]
sideseat-example-harness = { path = "../harness", editable = true }
sideseat = { path = "../../../sdk/python", editable = true }
