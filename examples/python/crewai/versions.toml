# The historical openinference-instrumentation-crewai releases this suite is replayed against; see `python -m harness matrix --help`
# and docs/engineering/framework-versions.md. The OpenInference CrewAI instrumentor writes the spans, so its release history is the window.
[matrix]
package = "openinference-instrumentation-crewai"
since = "2025-10-05"
resolved-before = "2026-10-05T00:00:00Z"
# The suite supports CPython below 3.14 only.
python = "3.13"
probes = ["tool_use", "chat"]
scenarios = ["tool_use", "chat"]

