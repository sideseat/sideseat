[project]
name = "example-crewai"
version = "0.0.0"
description = "CrewAI scenarios for SideSeat"
# CrewAI does not support Python 3.14 yet.
requires-python = ">=3.11,<3.14"
dependencies = [
    "crewai[bedrock,file-processing]>=1.15.23",
    "openinference-instrumentation-crewai>=1.1.20",
    "sideseat[crewai]",
    "sideseat-example-harness[bedrock]",
]

[tool.sideseat-example]
producer = "crewai"
integrations = ["crewai"]

[tool.uv]
required-version = "==0.12.13"
package = false

[tool.uv.sources]
sideseat-example-harness = { path = "../harness", editable = true }
sideseat = { path = "../../../sdk/python", editable = true }
