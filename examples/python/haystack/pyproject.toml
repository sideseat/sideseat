[project]
name = "example-haystack"
version = "0.0.0"
description = "Haystack scenarios for SideSeat"
requires-python = ">=3.11"
dependencies = [
    "haystack-ai>=3.3.0",
    "amazon-bedrock-haystack>=8.3.0",
    "mcp-haystack>=1.5.1",
    "opentelemetry-haystack>=1.0.0",
    "sideseat[haystack]",
    "sideseat-example-harness[bedrock]",
]

[tool.sideseat-example]
producer = "haystack"
integrations = ["haystack"]

# What Haystack's telemetry leaves out, for the truth derivation (`python -m harness truth`); proven absent from
# every capture by the rubric.
[tool.sideseat-example.truth.unexported]
media = "the attachments the user sent: the telemetry replaces their bytes with a placeholder of their length (`Base64 string (N characters)`)"

[tool.uv]
required-version = "==0.12.13"
package = false

[tool.uv.sources]
sideseat-example-harness = { path = "../harness", editable = true }
sideseat = { path = "../../../sdk/python", editable = true }
