[project]
name = "haystack-sample"
version = "0.1.0"
description = "SideSeat telemetry sample for Haystack"
requires-python = ">=3.12,<3.14"
dependencies = [
    "telemetry-common",
    "sideseat[haystack]",
    "haystack-ai==3.3.0",
    "openai>=3.22.1",
    "httpx>=0.28.1,<1.0.dev0",
    "python-dotenv>=1.2.0",
]

[project.scripts]
telemetry-haystack = "cli:main"

[tool.uv]
required-version = "==0.12.13"
prerelease = "allow"

[tool.uv.sources]
telemetry-common = { path = "../common", editable = true }
sideseat = { path = "../../../sdk/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py", "samples/"]
