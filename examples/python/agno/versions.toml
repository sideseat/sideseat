# The historical openinference-instrumentation-agno releases this suite is replayed against; see `python -m harness matrix --help`
# and docs/engineering/framework-versions.md. The OpenInference Agno instrumentor writes the spans, so its release history is the window.
[matrix]
package = "openinference-instrumentation-agno"
since = "2025-10-05"
resolved-before = "2026-10-05T00:00:00Z"
probes = ["tool_use", "streaming"]
scenarios = ["tool_use", "streaming"]

# Each variant is the newest release of one telemetry class in `versions.census.json`.
[[variant]]
version = "0.1.34"
doc = "0.1.31-0.1.34: tool messages in the model input carry no llm.input_messages.#.message.tool_call_id."

[[variant]]
version = "1.0.13"
current = true
doc = "0.1.35 onwards: tool messages carry their tool_call_id. The suite's locked release; its fixtures are the ordinary capture."

