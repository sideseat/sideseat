[project]
name = "example-agno"
version = "0.0.0"
description = "Agno scenarios for SideSeat"
requires-python = ">=3.11"
dependencies = [
    "agno[anthropic,aws-bedrock,mcp]>=3.1.0",
    "filetype>=1.2",
    "openinference-instrumentation-agno>=1.0.13",
    "sideseat[agno]",
    "sideseat-example-harness[bedrock]",
]

[tool.sideseat-example]
producer = "agno"
integrations = ["agno"]

[tool.uv]
required-version = "==0.12.13"
package = false

[tool.uv.sources]
sideseat-example-harness = { path = "../harness", editable = true }
sideseat = { path = "../../../sdk/python", editable = true }
