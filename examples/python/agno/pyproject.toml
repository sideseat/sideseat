[project]
name = "example-agno"
version = "0.0.0"
description = "Agno scenarios for SideSeat"
requires-python = ">=3.11"
dependencies = [
    "agno[anthropic,aws-bedrock,mcp]>=3.1.0",
    "filetype>=1.2",
    "openinference-instrumentation-agno>=1.0.13",
    "sideseat[agno]",
    "sideseat-example-harness[bedrock]",
]

[tool.sideseat-example]
producer = "agno"
integrations = ["agno"]

[tool.sideseat-example.truth.unexported.withheld_reasoning]
reason = "reasoning the model signed and withheld the text of: Agno's telemetry exports no reasoning part for it, and no payload holds one"
scenarios = ["error", "session", "structured_output"]

[tool.sideseat-example.truth.unexported.reasoning_output]
reason = "reasoning the model signed and withheld the text of, on the call that produced it: Agno's telemetry leaves it out of that call's output, and only the next request's history re-sends it"
scenarios = ["multi_turn"]

[tool.uv]
required-version = "==0.12.13"
package = false

[tool.uv.sources]
sideseat-example-harness = { path = "../harness", editable = true }
sideseat = { path = "../../../sdk/python", editable = true }
