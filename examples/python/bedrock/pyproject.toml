[project]
name = "example-bedrock"
version = "0.0.0"
description = "Amazon Bedrock (boto3 Converse) scenarios for SideSeat"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.107",
    "opentelemetry-instrumentation-botocore>=0.66b0",
    "sideseat[bedrock]",
    "sideseat-example-harness[bedrock]",
]

[tool.sideseat-example]
producer = "bedrock"
integrations = ["bedrock"]

[tool.uv]
required-version = "==0.12.13"
package = false

[tool.uv.sources]
sideseat-example-harness = { path = "../harness", editable = true }
sideseat = { path = "../../../sdk/python", editable = true }
