[project]
name = "example-google-genai"
version = "0.0.0"
description = "Google Gen AI SDK (Gemini Developer API) scenarios for SideSeat"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.28.0",
    "logfire[google-genai]>=5.1.1",
    "sideseat[google-genai]",
    "sideseat-example-harness",
]

[tool.sideseat-example]
producer = "google-genai"
integrations = ["google-genai"]
# Gemini is not served by Bedrock: the real client talks to the harness's local Gemini endpoint.
default-model = "fake-gemini"

# What the Google Gen AI instrumentation leaves out of its telemetry, for the truth derivation
# (`python -m harness truth`); each is proven absent from every capture by the rubric. With automatic
# function calling the client runs several model calls inside one `generate_content`, and the
# instrumentation records one span for the run - its final answer - and one `execute_tool` span per
# function it ran, without the model's call id. A streamed run records each model call.
[tool.sideseat-example.truth.unexported.tool_call_ids]
reason = "the model's function-call ids: each execute_tool span records the function, its arguments and its result, never the id the model gave the call"
scenarios = ["tool_use", "error", "streaming"]
# Releases before 1.1 record a streamed call's functions the same way; later ones keep the model's ids.
modes = { streaming = ["native@0.6b0+semconv-latest", "native@0.7b1+semconv-latest", "native@1.0b1"] }

[tool.sideseat-example.truth.unexported.tool_calling_rounds]
reason = "the model responses that only call functions: automatic function calling records one generate_content span for the whole run, carrying the final answer, so a round's calls appear one execution at a time"
scenarios = ["tool_use", "error", "streaming"]
modes = { streaming = ["native@0.6b0+semconv-latest", "native@0.7b1+semconv-latest", "native@1.0b1"] }

[tool.sideseat-example.truth.unexported.tool_round_run_spans]
reason = "the own span of the call that answers the tool round: from release 1.1 the Google GenAI instrumentation records a streamed automatic function-calling run on one generate_content span, carrying the first call's function call and the second call's answer, so the second call has no span of its own"
scenarios = ["streaming"]
modes = { streaming = ["native", "sdk", "native@1.1b1"] }

[tool.sideseat-example.truth.unexported.usage_output]
reason = "the first call's output tokens: the run's one generate_content span states a single output count for the whole run, which is not the first call's, and no payload carries the first call's count"
scenarios = ["streaming"]
modes = { streaming = ["native", "sdk", "native@1.1b1"] }

[tool.sideseat-example.truth.unexported.reasoning_kind]
reason = "the model's thoughts: the Google GenAI instrumentation records a thought part as an ordinary text part, with nothing marking it as a thought, in the native setup and the SDK's alike"
scenarios = ["reasoning"]
modes = { reasoning = ["native", "sdk"] }

[tool.uv]
required-version = "==0.12.13"
package = false

[tool.uv.sources]
sideseat-example-harness = { path = "../harness", editable = true }
sideseat = { path = "../../../sdk/python", editable = true }
