[project]
name = "example-google-genai"
version = "0.0.0"
description = "Google Gen AI SDK (Gemini Developer API) scenarios for SideSeat"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.28.0",
    "logfire[google-genai]>=5.1.1",
    "sideseat[google-genai]",
    "sideseat-example-harness",
]

[tool.sideseat-example]
producer = "google-genai"
integrations = ["google-genai"]
# Gemini is not served by Bedrock: the real client talks to the harness's local Gemini endpoint.
default-model = "fake-gemini"

[tool.uv]
required-version = "==0.12.13"
package = false

[tool.uv.sources]
sideseat-example-harness = { path = "../harness", editable = true }
sideseat = { path = "../../../sdk/python", editable = true }
