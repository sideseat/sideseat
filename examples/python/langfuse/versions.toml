# The historical langfuse releases this suite is replayed against; see `python -m harness matrix --help`
# and docs/engineering/framework-versions.md. Langfuse's SDK writes the langfuse.observation.* spans, so its release history is the window.
[matrix]
package = "langfuse"
since = "2025-10-05"
resolved-before = "2026-10-05T00:00:00Z"
probes = ["tool_use", "streaming"]
scenarios = ["tool_use", "streaming"]

# Each variant is the newest release of one telemetry class in `versions.census.json`.
[[variant]]
version = "4.6.1"
doc = "4.2.0-4.6.1: the earliest release that takes an exporter."

[[variant]]
version = "4.9.0"
doc = "4.7.0-4.9.0: langfuse.internal.is_app_root on the root observation."

[[variant]]
version = "4.13.2"
doc = "4.9.1-4.13.2: message JSON changes inside the same carriers."

[[variant]]
version = "4.16.0"
current = true
doc = "4.14 onwards: message JSON changes again. The suite's locked release; its fixtures are the ordinary capture."

