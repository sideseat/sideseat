[project]
name = "example-logfire"
version = "0.0.0"
description = "Logfire scenarios with the OpenAI SDK on Amazon Bedrock for SideSeat"
requires-python = ">=3.11"
dependencies = [
    "logfire>=5.1.1",
    # Logfire's MCP integration imports module paths that mcp 2 renamed.
    "mcp>=1.24,<2",
    "sideseat-example-harness[openai]",
]

[tool.sideseat-example]
producer = "logfire"
integrations = ["logfire"]
default-model = "gpt"

[tool.uv]
required-version = "==0.12.13"
package = false

[tool.uv.sources]
sideseat-example-harness = { path = "../harness", editable = true }
sideseat = { path = "../../../sdk/python", editable = true }
