[project]
name = "example-semantic-kernel"
version = "0.0.0"
description = "Semantic Kernel scenarios for SideSeat"
# Semantic Kernel cannot parse builtin generic annotations on Python 3.14.
requires-python = ">=3.11,<3.14"
dependencies = [
    # The aws extra installs boto3 below 1.43, which the harness's bedrock extra would exclude; the
    # harness needs only some boto3 to record model traffic.
    "semantic-kernel[aws,mcp]>=1.44.1",
    "sideseat",
    "sideseat-example-harness",
]

[tool.sideseat-example]
producer = "semantic-kernel"
integrations = ["semantic-kernel"]

[tool.uv]
required-version = "==0.12.13"
package = false

[tool.uv.sources]
sideseat-example-harness = { path = "../harness", editable = true }
sideseat = { path = "../../../sdk/python", editable = true }
