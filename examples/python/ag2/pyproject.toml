[project]
name = "example-ag2"
version = "0.0.0"
description = "AG2 scenarios for SideSeat"
requires-python = ">=3.11"
dependencies = [
    "ag2[bedrock,mcp,tracing]>=1.1.1",
    "sideseat[ag2]",
    "sideseat-example-harness[bedrock]",
]

[tool.sideseat-example]
producer = "ag2"
integrations = ["ag2"]

# What AG2's telemetry leaves out, for the truth derivation (`python -m harness truth`); proven absent from
# every capture by the rubric.
[tool.sideseat-example.truth.unexported]
media = "the attachments the user sent: AG2's telemetry records a message's text only, and their bytes are in no payload"

[tool.uv]
required-version = "==0.12.13"
package = false

[tool.uv.sources]
sideseat-example-harness = { path = "../harness", editable = true }
sideseat = { path = "../../../sdk/python", editable = true }
