# The historical openai-agents releases this suite is replayed against; see `python -m harness matrix --help`
# and docs/engineering/framework-versions.md. The Agents SDK defines the spans Logfire exports, so its release history is the window.
[matrix]
package = "openai-agents"
since = "2025-10-05"
resolved-before = "2026-10-05T00:00:00Z"
probes = ["tool_use", "streaming"]
scenarios = ["tool_use", "streaming"]

# Each variant is the newest release of one telemetry class in `versions.census.json`; the classes differ in
# the JSON of Logfire's events and messages attributes.
[[variant]]
version = "0.18.1"
doc = "0.18.1: the earliest release that runs on the current OpenAI SDK."

[[variant]]
version = "0.19.4"
doc = "0.18.2-0.19.4: message JSON changes inside the same carriers."

[[variant]]
version = "0.20.0"
doc = "0.20.0: message JSON changes again."

[[variant]]
version = "0.21.0"
doc = "0.21.0: message JSON changes again."

[[variant]]
version = "0.23.1"
current = true
doc = "0.21.1 onwards: message JSON changes again. The suite's locked release; its fixtures are the ordinary capture."

[[exempt]]
version = "0.4.0"
reason = "With the OpenAI SDK the suite locks, 0.18.0 and earlier cannot build their usage record (InputTokensDetails now requires cache_write_tokens), and the current Logfire imports span types (TaskSpanData) they do not have; the OpenAI SDK of their day does not take the harness's httpx2 client."
revisit = "2027-01-05"

