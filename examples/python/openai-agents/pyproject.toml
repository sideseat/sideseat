[project]
name = "example-openai-agents"
version = "0.0.0"
description = "OpenAI Agents SDK scenarios with the Responses API on Amazon Bedrock for SideSeat"
requires-python = ">=3.11"
dependencies = [
    "openai-agents>=0.23.1",
    "logfire>=5.1.1",
    "sideseat-example-harness[openai]",
]

[tool.sideseat-example]
producer = "openai-agents"
integrations = ["openai-agents"]
default-model = "gpt"
# Bedrock serves no provider-run tools on bedrock-runtime, so the search runs against the local fake.
scenario-models = { server_tools = "fake-openai" }

[tool.uv]
required-version = "==0.12.13"
package = false

[tool.uv.sources]
sideseat-example-harness = { path = "../harness", editable = true }
sideseat = { path = "../../../sdk/python", editable = true }
