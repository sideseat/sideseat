[project]
name = "openai-agents-sample"
version = "0.1.0"
description = "SideSeat telemetry sample for OpenAI Agents SDK"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pymupdf>=1.24",
    "boto3>=1.35",
    "numpy>=1.26",
    "telemetry-common[bedrock-openai]",
    "sideseat[openai-agents]",
    "openai-agents>=0.12.1",
    "python-dotenv>=1.2.0",
]

[project.scripts]
openai-agents = "cli:main"
telemetry-openai-agents = "cli:main"

[tool.uv]
# The resolver version this repository declares. Restated here because a project's own `[tool.uv]`
# **replaces** the `uv.toml` found above it rather than merging with it, so without this line these
# projects were the ones a differently-versioned uv could still write lockfiles for. Held equal to the
# root by `every_uv_project_requires_the_same_resolver`.
required-version = "==0.12.13"
prerelease = "allow"

[tool.uv.sources]
telemetry-common = { path = "../common", editable = true }
sideseat = { path = "../../../sdk/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py", "samples/"]
