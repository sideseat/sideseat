[project]
name = "anthropic-sample"
version = "0.1.0"
description = "SideSeat telemetry sample for Anthropic API"
requires-python = ">=3.12,<3.14"
dependencies = [
    "telemetry-common[bedrock-anthropic]",
    "sideseat[anthropic]",
    "anthropic>=0.84.0",
    "pymupdf>=1.25.0",
    "python-dotenv>=1.2.0",
    # anthropic >= 1.0 uses httpx2; logfire's Anthropic instrumentation still imports
    # httpx at module level, so it must be present or no spans are produced.
    "httpx>=0.27",
]

[project.scripts]
anthropic-provider = "cli:main"

[tool.uv]
# The resolver version this repository declares. Restated here because a project's own `[tool.uv]`
# **replaces** the `uv.toml` found above it rather than merging with it, so without this line these
# projects were the ones a differently-versioned uv could still write lockfiles for. Held equal to the
# root by `every_uv_project_requires_the_same_resolver`.
required-version = "==0.12.13"
prerelease = "allow"

[tool.uv.sources]
telemetry-common = { path = "../common", editable = true }
sideseat = { path = "../../../sdk/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py", "samples/"]
