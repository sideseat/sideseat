[project]
name = "example-anthropic"
version = "0.0.0"
description = "Anthropic SDK scenarios for SideSeat"
requires-python = ">=3.11"
dependencies = [
    "anthropic[bedrock]>=1.11.0",
    "logfire>=5.1.1",
    "sideseat[anthropic]",
    "sideseat-example-harness[anthropic]",
]

[tool.sideseat-example]
producer = "anthropic"
integrations = ["anthropic"]
default-model = "claude"
# Web search is not available on Amazon Bedrock, so the search runs against the local fake.
scenario-models = { server_tools = "fake-anthropic" }

[tool.uv]
required-version = "==0.12.13"
package = false

[tool.uv.sources]
sideseat-example-harness = { path = "../harness", editable = true }
sideseat = { path = "../../../sdk/python", editable = true }
