[project]
name = "example-autogen"
version = "0.0.0"
description = "AutoGen AgentChat scenarios for SideSeat"
requires-python = ">=3.11"
dependencies = [
    "autogen-agentchat>=0.7.5",
    "autogen-ext[anthropic,mcp]>=0.7.5",
    # autogen-ext's Anthropic client imports tiktoken, which only its openai extra declares.
    "tiktoken>=0.14.0",
    "openinference-instrumentation-autogen-agentchat>=0.1.21",
    "sideseat[autogen]",
    "sideseat-example-harness[anthropic]",
]

[tool.sideseat-example]
producer = "autogen"
integrations = ["autogen"]
# AutoGen reaches Claude through the Anthropic SDK's Bedrock client.
default-model = "claude"

[tool.uv]
required-version = "==0.12.13"
package = false

[tool.uv.sources]
sideseat-example-harness = { path = "../harness", editable = true }
sideseat = { path = "../../../sdk/python", editable = true }
