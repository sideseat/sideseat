[project]
name = "example-autogen"
version = "0.0.0"
description = "AutoGen AgentChat scenarios for SideSeat"
requires-python = ">=3.11"
dependencies = [
    "autogen-agentchat>=0.7.5",
    "autogen-ext[openai,mcp]>=0.7.5",
    "openinference-instrumentation-autogen-agentchat>=0.1.21",
    "sideseat[autogen]",
    "sideseat-example-harness",
]

[tool.sideseat-example]
producer = "autogen"
integrations = ["autogen"]
# A third mode beside `native` and `sdk`: `autogen_core` logs one structured event per model call, so the
# conversation can arrive as OTLP log records with nothing else instrumented. See logs.py.
modes = ["native", "sdk", "logs"]
# The OpenInference AgentChat instrumentor records model requests only from AutoGen's OpenAI
# clients, so the suite runs one against the harness's deterministic local OpenAI endpoint.
default-model = "fake-openai"

[tool.uv]
required-version = "==0.12.13"
package = false

[tool.uv.sources]
sideseat-example-harness = { path = "../harness", editable = true }
sideseat = { path = "../../../sdk/python", editable = true }
