[project]
name = "browser-use-sample"
version = "0.1.0"
description = "SideSeat telemetry sample for BrowserUse"
requires-python = ">=3.12,<3.14"
dependencies = [
    "telemetry-common",
    "sideseat",
    "browser-use==0.13.10",
    "lmnr==0.7.64",
    "python-dotenv>=1.2.0",
]

[project.scripts]
telemetry-browser-use = "cli:main"

[tool.uv]
required-version = "==0.12.13"
prerelease = "allow"

[tool.uv.sources]
telemetry-common = { path = "../common", editable = true }
sideseat = { path = "../../../sdk/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py", "samples/"]
