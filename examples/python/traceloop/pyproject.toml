[project]
name = "example-traceloop"
version = "0.0.0"
description = "TraceLoop (OpenLLMetry) scenarios on Amazon Bedrock for SideSeat"
requires-python = ">=3.11"
dependencies = [
    "traceloop-sdk>=0.62.4",
    # traceloop-sdk imports both at startup without declaring them, and nothing else brings them.
    "requests>=2.34",
    "httpx>=0.28",
    # opentelemetry-instrumentation-mcp 0.62 patches module paths that mcp 2 renamed.
    "mcp>=1.24,<2",
    "sideseat-example-harness[bedrock]",
]

[tool.sideseat-example]
producer = "traceloop"
integrations = ["traceloop"]

# What Traceloop's telemetry states wrongly with the right value in no payload, for the truth derivation
# (`python -m harness truth`); proven absent from every capture by the rubric.
[tool.sideseat-example.truth.unexported]
model = "the model the call addressed: Traceloop records the Bedrock model id without the inference profile's region prefix (`global.`), in every attribute"

[tool.uv]
required-version = "==0.12.13"
package = false

[tool.uv.sources]
sideseat-example-harness = { path = "../harness", editable = true }
sideseat = { path = "../../../sdk/python", editable = true }
