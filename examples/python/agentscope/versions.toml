# The historical agentscope releases this suite is replayed against; see `python -m harness matrix --help`
# and docs/engineering/framework-versions.md. AgentScope writes its own semconv spans, so its release history is the window.
[matrix]
package = "agentscope"
since = "2025-10-05"
resolved-before = "2026-10-05T00:00:00Z"
probes = ["tool_use", "streaming"]
scenarios = ["tool_use", "streaming"]

# Each variant is the newest release of one telemetry class in `versions.census.json`.
[[variant]]
version = "2.0.6"
withheld = { tool_use = "2.0.6 writes no gen_ai.input.messages on its chat spans, so the user's turn is only on the invoke_agent span and the trace view orders it after the reply, which the golden invariants refuse; recorded once the reconstruction places it (rule-language backlog 156).", streaming = "2.0.6 writes no gen_ai.input.messages on its chat spans, so the user's turn is only on the invoke_agent span and the trace view orders it after the reply, which the golden invariants refuse; recorded once the reconstruction places it (rule-language backlog 156)." }
doc = "2.0.6: the earliest release that uses the client the suite gives it; chat spans carry gen_ai.output.messages but no gen_ai.input.messages."

[[variant]]
version = "2.0.9"
current = true
doc = "2.0.7 onwards: message JSON changes inside the same carriers. The suite's locked release; its fixtures are the ordinary capture."

