[project]
name = "example-agentscope"
version = "0.0.0"
description = "AgentScope scenarios for SideSeat"
requires-python = ">=3.11"
dependencies = [
    "agentscope>=2.0.9",
    "sideseat[agentscope]",
    "sideseat-example-harness[anthropic]",
]

[tool.sideseat-example]
producer = "agentscope"
integrations = ["agentscope"]
# AgentScope has no Bedrock model; its Anthropic model reaches Claude through the Anthropic SDK.
default-model = "claude"

# What AgentScope's telemetry states wrongly with the right value in no payload, for the truth derivation
# (`python -m harness truth`); proven absent from every capture by the rubric.
[tool.sideseat-example.truth.unexported.finish]
reason = "why a response that called tools ended: AgentScope records every response's finish as `stop`, and no payload keeps the provider's `tool_use`"
values = ["tool_use"]

[tool.sideseat-example.truth.unexported.reasoning_signature]
reason = "the signature of reasoning the model withheld the text of: AgentScope's telemetry exports the reasoning step as an empty part and drops its signature, which no payload holds"
scenarios = ["error", "files", "multi_turn", "session"]

[tool.uv]
required-version = "==0.12.13"
package = false

[tool.uv.sources]
sideseat-example-harness = { path = "../harness", editable = true }
sideseat = { path = "../../../sdk/python", editable = true }
