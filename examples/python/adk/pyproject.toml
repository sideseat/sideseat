[project]
name = "example-adk"
version = "0.0.0"
description = "Google Agent Development Kit scenarios for SideSeat"
requires-python = ">=3.11"
dependencies = [
    "google-adk[mcp]>=2.11.0",
    "litellm>=1.104.0",
    "sideseat-example-harness[bedrock]",
]

[tool.sideseat-example]
producer = "adk"
integrations = ["google-adk"]

# What ADK's telemetry states wrongly with the right value in no payload, for the truth derivation
# (`python -m harness truth`); proven absent from every capture by the rubric.
[tool.sideseat-example.truth.unexported.finish]
reason = "why a response that called tools ended: ADK records every response's finish as `stop`, and no payload keeps the provider's `tool_use`"
values = ["tool_use"]

[tool.sideseat-example.truth.unexported.reasoning_signature]
reason = "the signature of reasoning the model withheld the text of: ADK's telemetry exports the reasoning step as an empty thought part and drops its signature, which no payload holds"
scenarios = ["session"]

[tool.uv]
required-version = "==0.12.13"
package = false

[tool.uv.sources]
sideseat-example-harness = { path = "../harness", editable = true }
sideseat = { path = "../../../sdk/python", editable = true }
