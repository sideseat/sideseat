[project]
name = "example-adk"
version = "0.0.0"
description = "Google Agent Development Kit scenarios for SideSeat"
requires-python = ">=3.11"
dependencies = [
    "google-adk[mcp]>=2.11.0",
    "litellm>=1.104.0",
    "sideseat-example-harness[bedrock]",
]

[tool.sideseat-example]
producer = "adk"
integrations = ["google-adk"]

# What ADK's telemetry states wrongly with the right value in no payload, for the truth derivation
# (`python -m harness truth`); proven absent from every capture by the rubric.
[tool.sideseat-example.truth.unexported.finish]
reason = "why a response that called tools ended: ADK records every response's finish as `stop`, and no payload keeps the provider's `tool_use`"
values = ["tool_use"]

[[tool.sideseat-example.truth.states_unsent]]
text = "Handle the requests as specified in the System Instruction."
reason = "ADK 1.22.1 appends this user turn to a request whose last message holds only tool results, and records the request with it, but its LiteLLM client sends a message holding tool results as tool messages alone and drops the turn"
source = "google/adk/models/lite_llm.py in google-adk 1.22.1: _part_has_payload (line 346) counts no function response, _append_fallback_user_content_if_missing (line 357) appends the text, _content_to_message_param (line 446) returns only the tool messages; 1.23.0 sends the text"
scenarios = ["tool_use", "streaming"]
modes = { tool_use = ["native@1.22.1"], streaming = ["native@1.22.1"] }

[tool.uv]
required-version = "==0.12.13"
package = false

[tool.uv.sources]
sideseat-example-harness = { path = "../harness", editable = true }
sideseat = { path = "../../../sdk/python", editable = true }
