[project]
name = "example-langgraph"
version = "0.0.0"
description = "LangGraph scenarios for SideSeat"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.12",
    "langchain-aws>=1.8.0",
    "langchain-mcp-adapters>=0.3.2",
    "openinference-instrumentation-langchain>=0.1.78",
    "sideseat[langgraph]",
    "sideseat-example-harness[bedrock]",
]

[tool.sideseat-example]
producer = "langgraph"
integrations = ["langgraph"]

[tool.uv]
required-version = "==0.12.13"
package = false

[tool.uv.sources]
sideseat-example-harness = { path = "../harness", editable = true }
sideseat = { path = "../../../sdk/python", editable = true }
