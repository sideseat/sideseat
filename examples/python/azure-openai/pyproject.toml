[project]
name = "example-azure-openai"
version = "0.0.0"
description = "Azure OpenAI scenarios for SideSeat, against the harness's local OpenAI endpoint"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.24.0",
    "openinference-instrumentation-openai>=0.1.63",
    "sideseat[azure-openai]",
    "sideseat-example-harness",
]

[tool.sideseat-example]
producer = "azure-openai"
integrations = ["azure-openai"]
# Bedrock credentials cannot reach Azure: the real AzureOpenAI client talks to the local fake.
default-model = "fake-openai"

[tool.uv]
required-version = "==0.12.13"
package = false

[tool.uv.sources]
sideseat-example-harness = { path = "../harness", editable = true }
sideseat = { path = "../../../sdk/python", editable = true }
