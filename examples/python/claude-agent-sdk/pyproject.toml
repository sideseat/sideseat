[project]
name = "example-claude-agent-sdk"
version = "0.0.0"
description = "Claude Agent SDK scenarios for SideSeat"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.163",
    "sideseat-example-harness",
]

[tool.sideseat-example]
producer = "claude-agent-sdk"
integrations = ["claude-agent-sdk"]

[tool.uv]
required-version = "==0.12.13"
package = false

[tool.uv.sources]
sideseat-example-harness = { path = "../harness", editable = true }
sideseat = { path = "../../../sdk/python", editable = true }
