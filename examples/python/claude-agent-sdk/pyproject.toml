[project]
name = "example-claude-agent-sdk"
version = "0.0.0"
description = "Claude Agent SDK scenarios for SideSeat"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.163",
    "sideseat-example-harness",
]

[tool.sideseat-example]
producer = "claude-agent-sdk"
integrations = ["claude-agent-sdk"]

# What the Claude Agent SDK's telemetry leaves out, for the truth derivation (`python -m harness truth`); proven
# absent from every capture by the rubric.
[tool.sideseat-example.truth.unexported]
media = "the attachments the user sent: the telemetry names an attachment by the file it was read from (`[Image: source: <path>]`), never by its bytes"

tool_calling_round_output = "the tool calls of a response that only calls tools, on the call's own span: the Claude Agent SDK's llm_request span records no response content when the model calls tools, and its tool spans and the next request carry them"

[tool.sideseat-example.truth.unexported.withheld_reasoning]
reason = "reasoning the model signed and withheld the text of: the Claude Agent SDK's telemetry exports no reasoning part for it, and no payload holds one"
scenarios = ["reasoning"]

[tool.uv]
required-version = "==0.12.13"
package = false

[tool.uv.sources]
sideseat-example-harness = { path = "../harness", editable = true }
sideseat = { path = "../../../sdk/python", editable = true }
