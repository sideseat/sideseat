[project]
name = "example-openinference"
version = "0.0.0"
description = "OpenInference scenarios on Amazon Bedrock for SideSeat"
requires-python = ">=3.11"
dependencies = [
    "openinference-instrumentation>=0.1.70",
    "openinference-instrumentation-bedrock>=0.1.56",
    "mcp>=1.24",
    "sideseat-example-harness[bedrock]",
]

[tool.sideseat-example]
producer = "openinference"
integrations = ["openinference"]

# What the Bedrock instrumentor's telemetry leaves out, for the truth derivation (`python -m harness truth`);
# proven absent from every capture by the rubric.
[tool.sideseat-example.truth.unexported.media]
reason = "the document the user sent: the flattened input messages drop a document block (an image is kept, its data redacted), and no payload holds its bytes"
modalities = ["document"]

[tool.uv]
required-version = "==0.12.13"
package = false

[tool.uv.sources]
sideseat-example-harness = { path = "../harness", editable = true }
sideseat = { path = "../../../sdk/python", editable = true }
