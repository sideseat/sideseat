[project]
name = "sideseat-python-conformance"
version = "0.1.0"
description = "Credential-free SideSeat Python SDK OTLP conformance emitter"
requires-python = ">=3.14,<3.15"
dependencies = [
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "sideseat",
]

[tool.uv]
required-version = "==0.12.13"

[tool.uv.sources]
sideseat = { path = "../../../sdk/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["conformance.py"]
