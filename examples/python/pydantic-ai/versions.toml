# The historical Pydantic AI releases this suite is replayed against; see `python -m harness matrix --help`.
# Each variant is the newest release of one telemetry class in `versions.census.json`.
# Pydantic AI ships 1.x and 2.x side by side; `Agent.instrument_all()` uses each release's default
# instrumentation version.
[matrix]
package = "pydantic-ai-slim"
pin = "pydantic-ai-slim[bedrock,mcp]=={version}"
since = "2025-10-05"
resolved-before = "2026-10-05T00:00:00Z"
probes = ["tool_use", "streaming"]
scenarios = ["tool_use", "streaming"]
# Early 1.x releases import `opentelemetry._events`, which OpenTelemetry 1.45 removed while their bound
# stayed open: OpenTelemetry resolves as of each release's own day, as it did for its users.
era = [
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-proto",
    "opentelemetry-semantic-conventions",
    "opentelemetry-exporter-otlp-proto-common",
    "opentelemetry-exporter-otlp-proto-http",
]

