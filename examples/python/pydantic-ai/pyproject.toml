[project]
name = "pydantic-ai-sample"
version = "0.1.0"
description = "SideSeat telemetry sample for Pydantic AI"
requires-python = ">=3.12,<3.14"
dependencies = [
    "telemetry-common",
    "sideseat[pydantic-ai]",
    "pydantic-ai>=2.50.0",
    "python-dotenv>=1.2.0",
]

[project.scripts]
telemetry-pydantic-ai = "cli:main"

[tool.uv]
required-version = "==0.12.13"
prerelease = "allow"

[tool.uv.sources]
telemetry-common = { path = "../common", editable = true }
sideseat = { path = "../../../sdk/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py", "samples/"]
