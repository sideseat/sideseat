[project]
name = "example-pydantic-ai"
version = "0.0.0"
description = "Pydantic AI scenarios for SideSeat"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai-slim[bedrock,mcp]>=2.53.0",
    "sideseat[pydantic-ai]",
    "sideseat-example-harness[bedrock]",
]

[tool.sideseat-example]
producer = "pydantic-ai"
integrations = ["pydantic-ai"]

[tool.uv]
required-version = "==0.12.13"
package = false

[tool.uv.sources]
sideseat-example-harness = { path = "../harness", editable = true }
sideseat = { path = "../../../sdk/python", editable = true }
