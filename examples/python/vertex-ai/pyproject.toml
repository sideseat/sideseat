[project]
name = "example-vertex-ai"
version = "0.0.0"
description = "Google Gen AI SDK (Vertex AI) scenarios for SideSeat"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.28.0",
    "logfire[google-genai]>=5.1.1",
    "sideseat[vertex-ai]",
    "sideseat-example-harness",
]

[tool.sideseat-example]
producer = "vertex-ai"
integrations = ["vertex-ai"]
# Vertex AI is not served by Bedrock: the real client talks to the harness's local Gemini endpoint,
# which serves the Vertex AI publisher-model routes.
default-model = "fake-gemini"

# What the Google Gen AI instrumentation leaves out of its telemetry, for the truth derivation
# (`python -m harness truth`); each is proven absent from every capture by the rubric. With automatic
# function calling the client runs several model calls inside one `generate_content`, and the
# instrumentation records one span for the run - its final answer - and one `execute_tool` span per
# function it ran, without the model's call id. A streamed run records each model call.
[tool.sideseat-example.truth.unexported.tool_call_ids]
reason = "the model's function-call ids: each execute_tool span records the function, its arguments and its result, never the id the model gave the call"
scenarios = ["tool_use", "error", "streaming"]
# Releases before 1.1 record a streamed call's functions the same way; later ones keep the model's ids.
modes = { streaming = ["native@0.7b1+semconv-latest", "native@1.0b1"] }

[tool.sideseat-example.truth.unexported.tool_calling_rounds]
reason = "the model responses that only call functions: automatic function calling records one generate_content span for the whole run, carrying the final answer, so a round's calls appear one execution at a time"
scenarios = ["tool_use", "error", "streaming"]
modes = { streaming = ["native@0.7b1+semconv-latest", "native@1.0b1"] }

[tool.sideseat-example.truth.unexported.reasoning_kind]
reason = "the model's thoughts: the Vertex AI instrumentation of the native setup records a thought part as an ordinary text part, with nothing marking it as a thought"
scenarios = ["reasoning"]
modes = { reasoning = ["native"] }

[tool.uv]
required-version = "==0.12.13"
package = false

[tool.uv.sources]
sideseat-example-harness = { path = "../harness", editable = true }
sideseat = { path = "../../../sdk/python", editable = true }
