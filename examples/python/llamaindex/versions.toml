# The historical openinference-instrumentation-llama-index releases this suite is replayed against; see `python -m harness matrix --help`
# and docs/engineering/framework-versions.md. The OpenInference LlamaIndex instrumentor writes the spans, so its release history is the window.
[matrix]
package = "openinference-instrumentation-llama-index"
since = "2025-10-05"
resolved-before = "2026-10-05T00:00:00Z"
probes = ["tool_use", "streaming"]
scenarios = ["tool_use", "streaming"]

# Each variant is the newest release of one telemetry class in `versions.census.json`.
[[variant]]
version = "4.3.8"
withheld = { tool_use = "4.3.6-4.3.8 record a tool-calling turn's input without its tool calls, which the reconstruction shows as an empty text block that the golden invariants refuse; recorded once the asset drops it (rule-language backlog 156).", streaming = "4.3.6-4.3.8 record a tool-calling turn's input without its tool calls, which the reconstruction shows as an empty text block that the golden invariants refuse; recorded once the asset drops it (rule-language backlog 156)." }
doc = "4.3.6-4.3.8: tool calls in the model input are not recorded."

[[variant]]
version = "4.3.10"
doc = "4.3.9-4.3.10: llm.input_messages.#.message.tool_calls.#.tool_call.* in the model input."

[[variant]]
version = "4.5.2"
doc = "4.4.0-4.5.2: message JSON changes inside the same carriers."

[[variant]]
version = "4.5.4"
current = true
doc = "4.5.3 onwards: message JSON changes again. The suite's locked release; its fixtures are the ordinary capture."
