[project]
name = "example-llamaindex"
version = "0.0.0"
description = "LlamaIndex scenarios for SideSeat"
requires-python = ">=3.11"
dependencies = [
    "llama-index-core>=0.14.25",
    "llama-index-llms-bedrock-converse>=0.15.3",
    "llama-index-tools-mcp>=0.6.0",
    "openinference-instrumentation-llama-index>=4.5.4",
    "sideseat[llama-index]",
    "sideseat-example-harness[bedrock]",
]

[tool.sideseat-example]
producer = "llama-index"
integrations = ["llama-index"]

# What LlamaIndex's telemetry leaves out, for the truth derivation (`python -m harness truth`); proven absent from
# every capture by the rubric.
[tool.sideseat-example.truth.unexported.media]
reason = "the document the user sent: the flattened input messages drop a document block (an image is kept, its data redacted), and no payload holds its bytes"
modalities = ["document"]

[tool.sideseat-example.truth.unexported.withheld_reasoning]
reason = "reasoning the model signed and withheld the text of: LlamaIndex's telemetry exports no reasoning part for it, and no payload holds one"
scenarios = ["multi_agent", "multi_turn", "session"]

[tool.uv]
required-version = "==0.12.13"
package = false

[tool.uv.sources]
sideseat-example-harness = { path = "../harness", editable = true }
sideseat = { path = "../../../sdk/python", editable = true }
