[project]
name = "llamaindex-sample"
version = "0.1.0"
description = "SideSeat telemetry sample for LlamaIndex"
requires-python = ">=3.12,<3.14"
dependencies = [
    "telemetry-common",
    "sideseat[llama-index]",
    "llama-index-core>=0.14.25",
    "llama-index-llms-openai>=0.8.2",
    "openai>=1.108.1,<3",
    "httpx>=0.28.1,<1.0.dev0",
    "python-dotenv>=1.2.0",
]

[project.scripts]
telemetry-llamaindex = "cli:main"

[tool.uv]
required-version = "==0.12.13"
prerelease = "allow"

[tool.uv.sources]
telemetry-common = { path = "../common", editable = true }
sideseat = { path = "../../../sdk/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py", "samples/"]
