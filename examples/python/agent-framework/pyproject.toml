[project]
name = "example-agent-framework"
version = "0.0.0"
description = "Microsoft Agent Framework scenarios for SideSeat"
requires-python = ">=3.11"
dependencies = [
    # Core plus the providers the scenarios use: the agent-framework meta package installs every
    # provider integration.
    "agent-framework-core>=1.19.0",
    "agent-framework-anthropic>=1.0.0b260918",
    "agent-framework-orchestrations>=1.2.0",
    # The range agent-framework-core declares for its MCP tools.
    "mcp>=1.24,<2",
    "sideseat",
    "sideseat-example-harness[bedrock]",
]

[tool.sideseat-example]
producer = "agent-framework"
integrations = ["agent-framework"]
# The Anthropic Bedrock client: Agent Framework's Converse client sends no images and no thinking settings.
default-model = "claude"

[tool.sideseat-example.truth.unexported.reasoning_signature]
reason = "the signature of reasoning the model withheld the text of: Agent Framework's telemetry exports the reasoning step as an empty part and drops its signature, which no payload holds"
scenarios = ["error", "multi_turn", "session", "structured_output"]

[tool.sideseat-example.truth.unexported.usage_input]
reason = "the call's input tokens: Agent Framework 1.0.1 to 1.9.0, streaming through Bedrock Anthropic, adds the stream's first usage report to its last, so it overstates input and output tokens and the cost shown for those releases is high; no payload carries the call's real count"
scenarios = ["streaming"]
modes = { streaming = ["native@1.0.1", "native@1.8.1", "native@1.9.0"] }

[tool.sideseat-example.truth.unexported.usage_output]
reason = "the call's output tokens: Agent Framework 1.0.1 to 1.9.0, streaming through Bedrock Anthropic, adds the stream's first usage report to its last, so it overstates input and output tokens and the cost shown for those releases is high; no payload carries the call's real count"
scenarios = ["streaming"]
modes = { streaming = ["native@1.0.1", "native@1.8.1", "native@1.9.0"] }

[tool.uv]
required-version = "==0.12.13"
package = false

[tool.uv.sources]
sideseat-example-harness = { path = "../harness", editable = true }
sideseat = { path = "../../../sdk/python", editable = true }
