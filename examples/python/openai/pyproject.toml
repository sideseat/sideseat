[project]
name = "example-openai"
version = "0.0.0"
description = "OpenAI SDK scenarios for SideSeat"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.24.0",
    "logfire>=5.1.1",
    "sideseat[openai]",
    "sideseat-example-harness[openai]",
]

[tool.sideseat-example]
producer = "openai"
integrations = ["openai"]
default-model = "gpt"

[tool.uv]
required-version = "==0.12.13"
package = false

[tool.uv.sources]
sideseat-example-harness = { path = "../harness", editable = true }
sideseat = { path = "../../../sdk/python", editable = true }
