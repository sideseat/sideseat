SPECIFICATION Spec

CONSTANTS
    Spans = {1, 2, 3, 4}
    Rules = {1, 2, 3, 4}

\* A configuration file cannot hold a TLA+ function expression, so the three
\* function- and set-valued constants are substituted from definitions in the
\* spec, where the instance is described and its choices explained.
CONSTANTS
    Rank <- ModelRank
    Matches <- ModelMatches
    Supersedes <- ModelSupersedes

INVARIANTS
    TypeOK
    AcyclicSupersedes
    UniqueWinner
    WinnerIsUnbeaten
    RankDecidesAmongUnbeaten
    SupersedesOverridesRank
    RefusalIsSound
    SupersedesRescuesAShadowedRule

\* Resolution is a function of the ruleset and the span, so there are no steps:
\* `Next` is `UNCHANGED`, and every state is terminal by construction.
CHECK_DEADLOCK FALSE
