# Kept in step with the claim in SECURITY.md that dependencies are updated through Dependabot: it covered
# GitHub Actions only, so that claim was true of the workflows and of nothing a user installs.
#
# One entry per manifest Dependabot can actually see. The sample suites under `examples/` are deliberately
# absent: each pins a framework version on purpose, so an automated bump there would change what the samples
# demonstrate rather than fix anything.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"

  # The Rust workspace: the server and the Rust SDK share one lockfile.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "rust"
    groups:
      rust-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directories:
      - "/web"
      - "/sdk/js"
      - "/cli"
      - "/docs"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  # Container base images and the local stack's pinned services. Both are manifests Dependabot reads, and
  # both pin exact versions - `debian:bookworm-slim`, `postgres:18.2`, `clickhouse-server:26.4.3.37`,
  # `valkey:9-alpine`, `hashicorp/vault:1.21.1` - so a security fix in any of them is invisible without
  # this. The `docker` ecosystem covers Compose files as well as Dockerfiles.
  - package-ecosystem: "docker"
    directories:
      - "/deploy"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "docker"

  # A Compose file is a **separate ecosystem** from a Dockerfile - `docker` does not cover it - so declaring
  # one entry for both left the four pinned services unwatched while the config looked complete.
  - package-ecosystem: "docker-compose"
    directories:
      - "/deploy/local"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "uv"
    directories:
      - "/"
      - "/sdk/python"
      # The standalone tools have their own lockfiles, so they need their own entries - "one entry per
      # manifest" was the stated rule and these two were missed.
      - "/tools/otel-replay"
      - "/tools/mcp-calculator"
      # The advisory scanner's own locked environment. Watched like any other manifest: a scanner nobody
      # updates goes stale against the advisory database it reads.
      - "/tools/audit"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "python"
