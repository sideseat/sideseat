name: CI

on:
  # No `paths-ignore`. Documentation used to be skipped here, which exempted every docs change from the
  # repository invariants - and those invariants exist to check documentation: the tree diagrams, the cited
  # module paths, the project structure. The one class of change most likely to break them was the one class
  # that never ran them.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-server:
    name: Server (fmt, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: server

      # Delegates to the Makefile so CI and `make` cannot drift. These ran from server/, which
      # meant sdk/rust was never formatted, linted or tested by anything.
      - name: Format check
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: make test-rust

  # The ClickHouse SQL is hand-written in a second dialect and only a real server can tell whether
  # it means what the DuckDB original means - some of it does not even parse. `make test-clickhouse`
  # runs the same test locally against its own container.
  check-clickhouse:
    name: ClickHouse (parity with DuckDB)
    runs-on: ubuntu-latest
    services:
      clickhouse:
        # Pinned: `latest` moving would fail an unrelated PR.
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_USER: sideseat
          CLICKHOUSE_PASSWORD: sideseat
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: server

      # Not `make test-clickhouse`: that target starts its own container, which a service
      # container already provides here.
      - name: ClickHouse parity
        env:
          SIDESEAT_TEST_CLICKHOUSE_URL: http://127.0.0.1:8123
          SIDESEAT_TEST_CLICKHOUSE_USER: sideseat
          SIDESEAT_TEST_CLICKHOUSE_PASSWORD: sideseat
        run: cargo test -p sideseat-server clickhouse -- --test-threads=1

      # A silent skip would make this job pass while testing nothing.
      - name: Fail if the parity test skipped
        env:
          SIDESEAT_TEST_CLICKHOUSE_URL: http://127.0.0.1:8123
          SIDESEAT_TEST_CLICKHOUSE_USER: sideseat
          SIDESEAT_TEST_CLICKHOUSE_PASSWORD: sideseat
        run: |
          cargo test -p sideseat-server clickhouse_matches_duckdb -- --nocapture 2>&1 \
            | tee /tmp/parity.log
          if grep -q "clickhouse parity: skipped" /tmp/parity.log; then
            echo "parity test skipped - the service container was not reachable"
            exit 1
          fi

  check-web:
    name: Web (fmt, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: cd web && npm ci

      - name: Format check
        run: cd web && npx prettier --check "src/**/*.{ts,tsx,css,json}"

      - name: Lint
        run: cd web && npm run lint

      - name: Test
        run: cd web && npm test -- --run

      # Here rather than in `make check`: the derivation needs an installed `semver`, which this job has and a
      # bare Rust checkout does not. Without a gate somewhere, a dependency bump can raise the Node floor while
      # everything stays green and the four places that state the requirement quietly become wrong.
      - name: Node requirement matches the lockfiles
        run: make node-floor

  check-sdk-js:
    name: JS SDK (fmt, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sdk/js/package-lock.json

      - name: Install dependencies
        run: cd sdk/js && npm ci

      - name: Format check
        run: cd sdk/js && npx prettier --check "src/**/*.ts"

      - name: Lint
        run: cd sdk/js && npm run lint

      - name: Test
        run: cd sdk/js && npm test

  check-sdk-python:
    name: Python SDK (fmt, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          enable-cache: true
          cache-dependency-glob: sdk/python/uv.lock

      - name: Install dependencies
        run: cd sdk/python && uv sync --extra dev

      - name: Format check
        run: cd sdk/python && uv run ruff format --check .

      - name: Lint
        run: cd sdk/python && uv run ruff check .

      - name: Type check
        run: cd sdk/python && uv run mypy src

      - name: Test
        run: cd sdk/python && uv run pytest

  check-versions:
    name: Version Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'

      - name: Verify all package versions match
        run: make version-check

  check-samples:
    name: Samples (fmt, lint, typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: examples/javascript/package-lock.json

      - uses: astral-sh/setup-uv@f94ec6bedd8674c4426838e6b50417d36b6ab231 # v5.4.1

      # The sample trees were checked by `make fmt-check`/`make lint` locally but by nothing in
      # CI, so unformatted or type-broken sample code could merge. Runs the same commands the
      # Makefile does, scoped to the sample trees.
      - name: Install JS sample dependencies
        run: cd examples/javascript && npm ci

      - name: Format check
        run: |
          cd examples/javascript && npx prettier --check "src/**/*.ts"
          cd "$GITHUB_WORKSPACE" && uv run ruff format --check examples/python

      - name: Lint
        run: |
          cd examples/javascript && npm run lint && npm run typecheck
          cd "$GITHUB_WORKSPACE" && uv run ruff check examples/python

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0`, because a scan of one commit is not a scan of the branch: a secret added and then
      # removed by a later commit of the same pull request is still in the history being proposed.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # Installed from the pinned release and **checksum-verified**, rather than through a third-party action:
      # this way CI runs the repository's own targets against the repository's own `.gitleaks.toml`, so the gate
      # and the hooks cannot disagree about what counts as a secret.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSLo /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      # The whole tree, then the branch's history. The local targets skip when gitleaks is absent so that a
      # fresh clone can still commit, which makes them a convenience; this job is the gate, and it is the only
      # place an external contribution is scanned at all.
      - name: Working tree
        run: make secret-scan-tree

      - name: Branch history
        run: make secret-scan-range RANGE=origin/${{ github.base_ref || 'main' }}..HEAD

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561 # stable
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        continue-on-error: true
        run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2024-0370 --ignore RUSTSEC-2026-0002

      - name: Run npm audit (web)
        run: cd web && npm audit --audit-level=high

      - name: Run npm audit (sdk/js)
        run: cd sdk/js && npm audit --audit-level=high
