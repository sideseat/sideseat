name: CI

on:
  # No `paths-ignore`. Documentation used to be skipped here, which exempted every docs change from the
  # repository invariants - and those invariants exist to check documentation: the tree diagrams, the cited
  # module paths, the project structure. The one class of change most likely to break them was the one class
  # that never ran them.
  pull_request:
  # And on a schedule, because the audits are the one class of check whose *answer changes without the code
  # changing*: a vulnerability disclosed today was invisible until somebody happened to open a pull request.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-server:
    name: Server (fmt, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: server

      # Delegates to the Makefile so CI and `make` cannot drift. These ran from server/, which
      # meant sdk/rust was never formatted, linted or tested by anything.
      - name: Format check
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: make test-rust

  # The ClickHouse SQL is hand-written in a second dialect and only a real server can tell whether
  # it means what the DuckDB original means - some of it does not even parse. `make test-clickhouse`
  # runs the same test locally against its own container.
  check-msrv:
    name: Rust MSRV (1.94.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561 # stable
        with:
          # The version `Cargo.toml` and CONTRIBUTING.md promise. Declaring `rust-version` refuses an older
          # toolchain and clippy's `incompatible_msrv` catches an item that is too new, but neither *compiles*
          # the workspace on that version - so the promise was unproven while every job used `stable`.
          toolchain: '1.94.1'

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: server
          key: msrv

      # No web-dist step: `cargo check` runs build scripts, and the API crate creates the placeholder the
      # asset embedding needs.
      - name: Check the whole workspace
        run: cargo check --locked --workspace --all-targets

  check-clickhouse:
    name: ClickHouse (parity with DuckDB)
    runs-on: ubuntu-latest
    services:
      clickhouse:
        # Pinned to the **same patch tag** `make test-clickhouse` uses. `latest` moving would fail an
        # unrelated PR, and a *different* pin here from the Makefile's meant CI and a developer's machine
        # tested different servers while both claimed to gate the same parity property.
        image: clickhouse/clickhouse-server:26.4.3.37
        env:
          CLICKHOUSE_USER: sideseat
          CLICKHOUSE_PASSWORD: sideseat
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: server

      # Not `make test-clickhouse`: that target starts its own container, which a service
      # container already provides here.
      - name: ClickHouse (unit and parity)
        env:
          SIDESEAT_TEST_CLICKHOUSE_URL: http://127.0.0.1:8123
          SIDESEAT_TEST_CLICKHOUSE_USER: sideseat
          SIDESEAT_TEST_CLICKHOUSE_PASSWORD: sideseat
        run: cargo test --locked -p sideseat-server clickhouse -- --test-threads=1

      # Two ways this job could pass while proving nothing, and each needs its own check.
      #
      #   - the suite **skips** when it cannot reach the server, by design, so `make check` stays green
      #     without Docker;
      #   - `cargo test` exits **0 for a filter that matches no test at all**, so renaming or moving the
      #     module leaves a green job with `0 passed`. Verified: a bogus filter exits 0.
      #
      # So the filter is the module path (not the bare word `clickhouse`, which also matches seventy unit
      # tests that would satisfy any "something ran" check), and the count is read back.
      - name: Prove the parity suite ran
        env:
          SIDESEAT_TEST_CLICKHOUSE_URL: http://127.0.0.1:8123
          SIDESEAT_TEST_CLICKHOUSE_USER: sideseat
          SIDESEAT_TEST_CLICKHOUSE_PASSWORD: sideseat
        run: |
          cargo test --locked -p sideseat-server --test clickhouse_parity \
            -- --test-threads=1 --nocapture 2>&1 | tee /tmp/parity.log
          if grep -q "clickhouse parity: skipped" /tmp/parity.log; then
            echo "parity suite skipped - the service container was not reachable"
            exit 1
          fi
          passed=$(sed -n 's/^test result: ok\. \([0-9]*\) passed.*/\1/p' /tmp/parity.log | head -1)
          if [ "${passed:-0}" -lt 1 ]; then
            echo "the parity filter matched no test - it has been renamed or moved, and this job was vacuous"
            exit 1
          fi
          echo "$passed ClickHouse parity test(s) ran"

  # **No two-shard job here, deliberately.** `make test-clickhouse-two-shard` is the only gate that can fail on
  # the `_local`-versus-`Distributed` reads and the anomaly table's front end - one shard makes those reads
  # equivalent - but every `ON CLUSTER` statement against that fixture takes ~90 seconds, so the suite runs for
  # about fifteen minutes. The cause is recorded on the Makefile target: a third distributed-DDL replica entry
  # named `localhost:9000` that neither node owns, which makes the other wait the hardcoded 90 s in
  # `markReplicasActive` before every task. Until that is understood the target is opt-in, and saying so here is
  # better than a job that times out or one nobody trusts.
  check-clickhouse-replicated:
    name: ClickHouse (replicated migration)
    runs-on: ubuntu-latest
    # Not a service container: this one needs `scripts/clickhouse-replicated/cluster.xml` mounted, and service
    # containers cannot mount a workspace file. Without the cluster config there is no Keeper, no
    # `remote_servers` entry and no macros, so `distributed: true` cannot start at all.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: server

      - name: Start a replicated ClickHouse
        run: |
          docker run -d --name sideseat-ch-repl -p 8299:8123 \
            -e CLICKHOUSE_USER=sideseat -e CLICKHOUSE_PASSWORD=sideseat \
            -e CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 \
            -v "$PWD/scripts/clickhouse-replicated/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro" \
            clickhouse/clickhouse-server:26.4.3.37
          for _ in $(seq 1 90); do
            curl -sf http://127.0.0.1:8299/ping >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8299/ping || {
            echo "the replicated server did not become ready"
            docker logs --tail 40 sideseat-ch-repl
            exit 1
          }
          docker exec sideseat-ch-repl clickhouse-client --user sideseat --password sideseat \
            -q "SELECT cluster, shard_num, replica_num FROM system.clusters WHERE cluster = 'test_cluster'"

      # The gate this job exists for: without it, deleting one of the seven `distributed_statements` catch-up
      # ALTERs left every other suite green, because they all run `distributed: false`.
      #
      # Two ways this could pass while proving nothing, both already learned once on the single-node job: the
      # tests **skip** when their URL is unset, by design, and `cargo test` exits **0 for a filter that matches
      # no test**. So the skip message is grepped for and the count is read back.
      - name: Replicated migration tests
        env:
          SIDESEAT_TEST_CLICKHOUSE_REPLICATED_URL: http://127.0.0.1:8299
          SIDESEAT_TEST_CLICKHOUSE_USER: sideseat
          SIDESEAT_TEST_CLICKHOUSE_PASSWORD: sideseat
        run: |
          cargo test --locked -p sideseat-server replicated \
            -- --test-threads=1 --nocapture 2>&1 | tee /tmp/replicated.log
          if grep -q "clickhouse replicated: skipped" /tmp/replicated.log; then
            echo "the replicated suite skipped - the container was not reachable, so this job was vacuous"
            exit 1
          fi
          passed=$(sed -n 's/^test result: ok\. \([0-9]*\) passed.*/\1/p' /tmp/replicated.log | head -1)
          if [ "${passed:-0}" -lt 2 ]; then
            echo "expected at least 2 replicated tests, saw ${passed:-0} - the filter no longer matches them"
            exit 1
          fi
          echo "$passed replicated migration test(s) ran"

      - name: Stop the replicated ClickHouse
        if: always()
        run: docker rm -fv sideseat-ch-repl >/dev/null 2>&1 || true

  check-postgres:
    name: PostgreSQL (parity with SQLite)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Pinned, matching `make test-postgres`: `latest` moving would fail an unrelated PR.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sideseat
          POSTGRES_PASSWORD: sideseat
          POSTGRES_DB: sideseat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sideseat -d sideseat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: server

      # The PostgreSQL SQL is hand-written in a second dialect and, until this job existed, had never
      # run against a server in CI: `make test-postgres` was the only path and nothing invoked it.
      #
      # Select the integration-test target explicitly: a name filter can match another suite or no tests,
      # and Cargo exits successfully in both cases.
      - name: PostgreSQL parity
        env:
          SIDESEAT_TEST_POSTGRES_URL: postgres://sideseat:sideseat@127.0.0.1:5432/sideseat
        run: |
          cargo test --locked -p sideseat-server --test postgres_parity \
            -- --test-threads=1 --nocapture 2>&1 | tee /tmp/pg-parity.log
          if grep -q "skipping PostgreSQL parity" /tmp/pg-parity.log; then
            echo "parity suite skipped - the service container was not reachable"
            exit 1
          fi
          passed=$(sed -n 's/^test result: ok\. \([0-9]*\) passed.*/\1/p' /tmp/pg-parity.log | head -1)
          if [ "${passed:-0}" -lt 1 ]; then
            echo "the parity filter matched no test - it has been renamed or moved, and this job was vacuous"
            exit 1
          fi
          echo "$passed PostgreSQL parity test(s) ran"

  check-redis:
    name: Redis (durable ingestion queue)
    runs-on: ubuntu-latest
    services:
      redis:
        # Pinned, matching `make test-redis`. The durability probe refuses AOF-off, `appendfsync no` and
        # any eviction policy that could drop an unread stream entry, so the options are not decoration:
        # with the image defaults the backend refuses to start and every test here skips.
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: server

      # A service container cannot take server arguments, so durability is configured over the wire -
      # which is also a check that `CONFIG SET` works, since the startup probe reads these back.
      - name: Configure durability
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends redis-tools
          redis-cli -h 127.0.0.1 config set appendonly yes
          redis-cli -h 127.0.0.1 config set appendfsync always
          redis-cli -h 127.0.0.1 config set maxmemory-policy noeviction

      # The consumer-group semantics that make an asynchronous 200 honest had never run against a Redis
      # in CI, and what that missed once was `XADD ... MAXLEN`, which trims by length and so deleted
      # payloads nobody had read.
      - name: Redis stream behaviour
        env:
          SIDESEAT_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: |
          cargo test --locked -p sideseat-server --lib data::topics::redis_stream_tests \
            -- --test-threads=1 --nocapture 2>&1 | tee /tmp/redis.log
          if grep -q "redis stream tests: skipped" /tmp/redis.log; then
            echo "redis stream tests skipped - the service container was not reachable"
            exit 1
          fi
          passed=$(sed -n 's/^test result: ok\. \([0-9]*\) passed.*/\1/p' /tmp/redis.log | head -1)
          if [ "${passed:-0}" -lt 1 ]; then
            echo "the filter matched no test - it has been renamed or moved, and this job was vacuous"
            exit 1
          fi
          echo "$passed Redis stream test(s) ran"

  check-redpanda:
    name: RedPanda (durable ingestion queue)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: server

      # Uses the same pinned image and non-vacuous live test as local development.
      - name: RedPanda queue behaviour
        run: make test-redpanda

  check-web:
    name: Web (fmt, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # `uv`, because one of the web tests parses the published Python snippets with `python3` and checks them
      # with `uvx pyflakes==3.4.0`. The job installed Node alone, so that check depended on the runner image
      # happening to carry uv - and its `the pyflakes probe is actually running` assertion is what would have
      # failed, which is a confusing way to be told a tool is missing.
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: '0.12.13'

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: cd web && npm ci

      - name: Format check
        run: cd web && npx prettier --check "src/**/*.{ts,tsx,css,json}"

      - name: Lint
        run: cd web && npm run lint

      - name: Test
        run: cd web && npm test -- --run

      # The **production build**, which nothing ran: `tsc -b` had been failing on two real type errors in
      # shipped components and on a test file using `node:child_process` inside the app project, with every gate
      # green. Testing an artefact is not the same as building it.
      - name: Build
        run: cd web && npm run build

      # Here rather than in `make check`: the derivation needs an installed `semver`, which this job has and a
      # bare Rust checkout does not. Without a gate somewhere, a dependency bump can raise the Node floor while
      # everything stays green and the four places that state the requirement quietly become wrong.
      - name: Node requirement matches the lockfiles
        run: make node-floor

  check-sdk-js:
    name: JS SDK (fmt, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sdk/js/package-lock.json

      - name: Install dependencies
        run: cd sdk/js && npm ci

      - name: Format check
        run: cd sdk/js && npx prettier --check "src/**/*.ts"

      - name: Lint
        run: cd sdk/js && npm run lint

      - name: Test
        run: cd sdk/js && npm test

      # tsup emits the declarations consumers type against, so a break here ships a package that cannot be
      # imported - and it was equally unbuilt by CI.
      - name: Build
        run: cd sdk/js && npm run build

  check-sdk-python:
    name: Python SDK (fmt, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          # The **executable**, not only the action: with no version the action installs the latest, so an
          # unchanged commit could be resolved by a different resolver. Verified against every lockfile in the
          # tree with `uv sync --locked` under exactly this version before pinning it.
          version: '0.12.13'
          enable-cache: true
          cache-dependency-glob: sdk/python/uv.lock

      - name: Install dependencies
        run: cd sdk/python && uv sync --locked --extra dev

      # Delegated to the Makefile, so CI and `make` cannot disagree about *what* is checked. Running ruff
      # inside `sdk/python` covered the SDK alone, while the Makefile had been extended to `scripts/` and
      # `tools/` - so the blind spot that change closed was still open in the only place that gates.
      - name: Format check
        run: make fmt-check-python

      - name: Lint
        run: make lint-python

      - name: Type check
        run: cd sdk/python && uv run --locked --extra dev mypy src

      - name: Test
        run: cd sdk/python && uv run --locked --extra dev pytest

      # The **published artefacts**, which nothing built: an editable install proves the source imports, not
      # that the sdist and wheel assemble - and a packaging break first appears at `uv publish` otherwise, the
      # same gap `web` and `sdk/js` had until their builds became steps.
      - name: Build
        run: make build-sdk-python

  check-versions:
    name: Version Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'

      - name: Verify all package versions match
        run: make version-check

  check-samples:
    name: Samples (fmt, lint, typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: examples/javascript/package-lock.json

      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: '0.12.13'

      # The sample trees were checked by `make fmt-check`/`make lint` locally but by nothing in
      # CI, so unformatted or type-broken sample code could merge. Runs the same commands the
      # Makefile does, scoped to the sample trees.
      - name: Install JS sample dependencies
        run: cd examples/javascript && npm ci

      - name: Format check
        run: |
          cd examples/javascript && npx prettier --check "src/**/*.ts"
          cd "$GITHUB_WORKSPACE" && uv run --locked ruff format --check examples/python

      - name: Lint
        run: |
          cd examples/javascript && npm run lint && npm run typecheck
          cd "$GITHUB_WORKSPACE" && uv run --locked ruff check examples/python

  specs:
    name: TLA+ Specifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # `make harden-spec` fetches tla2tools itself and fails on any violation, so this job needs nothing but a
      # JVM. It exists because CONTRIBUTING describes the specifications as checked and nothing checked them:
      # a broken `.tla` or `.cfg` could merge with every gate green.
      - name: Model-check every specification
        run: make harden-spec

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0`, because a scan of one commit is not a scan of the branch: a secret added and then
      # removed by a later commit of the same pull request is still in the history being proposed.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # Installed from the pinned release and **checksum-verified**, rather than through a third-party action:
      # this way CI runs the repository's own targets against the repository's own `.gitleaks.toml`, so the gate
      # and the hooks cannot disagree about what counts as a secret.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSLo /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      # The whole tree, then the branch's history. The local targets skip when gitleaks is absent so that a
      # fresh clone can still commit, which makes them a convenience; this job is the gate, and it is the only
      # place an external contribution is scanned at all.
      - name: Working tree
        run: make secret-scan-tree

      - name: Branch history
        run: make secret-scan-range RANGE=origin/${{ github.base_ref || 'main' }}..HEAD

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'

      # The Python audits below call `uv`, and this job installed Node and Rust only - so they depended on
      # whatever the runner image happens to ship.
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: '0.12.13'

      - uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561 # stable
        with:
          toolchain: stable

      - name: Install Rust supply-chain tools
        # Pin the tools as well as their dependency graphs.
        run: cargo install cargo-audit@0.22.2 cargo-deny@0.20.2 cargo-machete@0.9.2 --locked

      # Blocking policy for advisories, licences, bans and dependency sources. Accepted advisories belong in
      # deny.toml with their rationale.
      - name: Run cargo deny
        run: cargo deny check

      - name: Reject unused Rust dependencies
        run: cargo machete

      # Advisory-only, deliberately: `cargo audit` has no per-advisory rationale file, so a finding it reports
      # and `cargo deny` does not is information rather than a verdict. The gate above is the verdict.
      - name: Run cargo audit
        continue-on-error: true
        run: cargo audit

      - name: Run npm audit (web)
        run: cd web && npm audit --audit-level=high

      - name: Run npm audit (sdk/js)
        run: cd sdk/js && npm audit --audit-level=high

      - name: Run npm audit (examples/javascript)
        run: cd examples/javascript && npm audit --audit-level=high

      # The Python SDK is published, and no advisory scan covered it: `uv` has no audit of its own, and
      # Dependabot raises pull requests rather than failing a build - which is exactly how fourteen Cargo
      # advisories accumulated.
      #
      # `--all-extras` first, because `pip-audit` with no argument audits the *installed environment*: without
      # syncing the optional framework instrumentation, the scan covered the base dependencies and reported
      # clean about packages it had never seen. Environment mode rather than `-r`, because `pip-audit -r`
      # builds a throwaway venv through `ensurepip`, which is one more thing to depend on.
      #
      # **Once per resolution branch.** The lockfile splits on `python_full_version` at 3.11, 3.13 and 3.15 -
      # `websockets` resolves to 16.1.1 below 3.11 and 17.0.1 above, for instance - so auditing a single
      # interpreter leaves the other branches unexamined while the package supports `>=3.10`. Three
      # interpreters cover every branch that exists today; the `>=3.15` branch has no release to run yet.
      # The scanner runs from `tools/audit`, which has its **own lockfile**: `--with pip-audit==2.10.1` pinned
      # the tool and left uv to resolve its dependencies fresh on every run, so an unchanged commit could be
      # audited by different code. `--path` names the environment to examine, because a locked scanner run from
      # its own project audits *itself* otherwise - which reports clean about the wrong thing, and did while I
      # was testing this.
      - name: Run pip-audit (sdk/python, all extras, every interpreter branch)
        run: |
          for python in 3.10 3.12 3.13; do
            echo "--- python $python"
            (cd sdk/python && uv sync --locked --all-extras --python "$python")
            uv run --locked --project tools/audit pip-audit \
              --path "$(echo sdk/python/.venv/lib/python*/site-packages)"
          done

      # The two standalone tools have their own lockfiles and were covered by nothing. Extending the scan here
      # found `urllib3` PYSEC-2026-142 and `requests` PYSEC-2026-2275 in `otel-replay`, both fixed by a
      # `uv lock --upgrade`.
      - name: Run pip-audit (tools)
        run: |
          for tool in tools/otel-replay tools/mcp-calculator; do
            (cd "$tool" && uv sync --locked)
            uv run --locked --project tools/audit pip-audit \
              --path "$(echo "$tool"/.venv/lib/python*/site-packages)"
          done

      # Unconditional, like the other three. It was briefly gated by an allowlist of eight known advisories
      # while the Astro 7 upgrade was blocked by a Mermaid plugin; the upgrade landed, so there is nothing to
      # exempt and the allowlist script is gone. An exemption that outlives its reason is worse than none.
      - name: Run npm audit (docs)
        run: cd docs && npm audit --audit-level=high
