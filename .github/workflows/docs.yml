name: Build and Deploy Docs

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Keyed by ref so manually restarted builds for the same branch supersede older runs. The `pages` group belongs
# to the deploy job alone, keeping site builds independent from the deployment queue.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          # npm's download cache, not `docs/node_modules`: `npm ci` deletes that directory before installing,
          # so restoring it was work with no effect. Same shape as the three other Node jobs.
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      # No separate install step: `make build-docs` installs through `docs-deps`, and running `npm ci` first
      # guaranteed that condition was already satisfied - so CI proved the site builds and never once
      # exercised the target it builds with. A broken `docs-deps` passed.
      # `make build-docs` installs the npm dependencies (through `docs-deps`) and then the browser from the
      # *locked* playwright. This step is only for the system libraries a runner image lacks, which is why it
      # is `--with-deps` and why it must come **after** the install: run before `npm ci`, `npx playwright`
      # fetches whatever the registry currently publishes instead of the locked version, and the build then
      # downloads a second browser.
      # One step: `docs-system-deps` depends on `docs-deps`, so the npm install and the browser come with it.
      - name: Install documentation dependencies and the browser's system libraries
        run: make docs-system-deps

      - name: Build documentation
        run: make build-docs

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: docs/dist/

  deploy:
    needs: build-docs
    # Publishing is a manual action from main. `main` must be explicit because workflow_dispatch can target
    # any branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
