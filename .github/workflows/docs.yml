name: Build and Deploy Docs

on:
  workflow_dispatch:
  # Built on pull requests too, and only *deployed* from main. Building after merge means a broken site is
  # discovered on the branch that publishes it.
  pull_request:
    # `Makefile` is in both lists because this workflow builds through `make build-docs`: a change there
    # changes what it does, and both filters omitted it, so a Makefile-only regression to the docs build was
    # built neither before nor after merge. Spelled twice because GitHub's parser has no YAML anchors.
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - 'Makefile'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - 'Makefile'

permissions:
  contents: read
  pages: write
  id-token: write

# Keyed by ref, so a new push to a pull request supersedes its own earlier run. The `pages` group belongs to
# the deploy job alone: as a workflow-wide group it was shared by every pull-request build, so unrelated ones
# cancelled each other and could displace a queued deployment of `main` - GitHub keeps only one pending run
# per group. That only became reachable when pull requests started triggering this workflow.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          # npm's download cache, not `docs/node_modules`: `npm ci` deletes that directory before installing,
          # so restoring it was work with no effect. Same shape as the three other Node jobs.
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      # No separate install step: `make build-docs` installs through `docs-deps`, and running `npm ci` first
      # guaranteed that condition was already satisfied - so CI proved the site builds and never once
      # exercised the target it builds with. A broken `docs-deps` passed.
      # `make build-docs` installs the npm dependencies (through `docs-deps`) and then the browser from the
      # *locked* playwright. This step is only for the system libraries a runner image lacks, which is why it
      # is `--with-deps` and why it must come **after** the install: run before `npm ci`, `npx playwright`
      # fetches whatever the registry currently publishes instead of the locked version, and the build then
      # downloads a second browser.
      - name: Install documentation dependencies
        run: make docs-deps

      - name: Install the system libraries the browser needs
        run: cd docs && npx --no-install playwright install-deps chromium

      - name: Build documentation
        run: make build-docs

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: docs/dist/

  deploy:
    needs: build-docs
    # A pull request builds to prove the site still builds; publishing belongs to main alone - and `main` has
    # to be *said*, because `workflow_dispatch` can be aimed at any branch, so excluding pull requests alone
    # left a manual run from a branch able to publish it.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
