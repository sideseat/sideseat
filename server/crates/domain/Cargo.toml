[package]
name = "sideseat-domain"
version.workspace = true
license = "Apache-2.0"
publish = false
edition = "2024"
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
test-support = []

[dependencies]
sideseat-core = { path = "../core" }
sideseat-ports = { path = "../ports" }
sideseat-rule-assets = { path = "../rule-assets" }
anyhow = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
cuid2 = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
parking_lot = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_json_path = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
sideseat-adapter-blob-storage = { path = "../adapter-blob-storage" }
sideseat-adapter-cache = { path = "../adapter-cache" }
sideseat-adapter-duckdb = { path = "../adapter-duckdb" }
sideseat-adapter-sqlite = { path = "../adapter-sqlite" }
proptest = "1"
schemars = { workspace = true }
proc-macro2 = { version = "1", features = ["span-locations"] }
tempfile = "3"
