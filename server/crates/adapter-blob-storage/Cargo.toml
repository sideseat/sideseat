[package]
name = "sideseat-adapter-blob-storage"
version.workspace = true
license = "Apache-2.0"
publish = false
edition = "2024"
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
sideseat-ports = { path = "../ports" }
async-trait = { workspace = true }
aws-config = { workspace = true }
aws-sdk-s3 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

# `fsync` on Apple platforms, where std's `sync_all` is `F_FULLFSYNC`; see `filesystem::sync_handle`.
[target.'cfg(target_vendor = "apple")'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
