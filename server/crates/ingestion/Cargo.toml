[package]
name = "sideseat-ingestion"
version.workspace = true
license = "Apache-2.0"
publish = false
edition = "2024"
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
test-support = []

[dependencies]
sideseat-core = { path = "../core" }
sideseat-domain = { path = "../domain" }
sideseat-ports = { path = "../ports" }
async-trait = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
opentelemetry-proto = { workspace = true }
parking_lot = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
sideseat-domain = { path = "../domain", features = ["test-support"] }
sideseat-adapter-blob-storage = { path = "../adapter-blob-storage" }
sideseat-adapter-cache = { path = "../adapter-cache" }
sideseat-adapter-duckdb = { path = "../adapter-duckdb" }
sideseat-adapter-sqlite = { path = "../adapter-sqlite" }
sideseat-adapter-topics = { path = "../adapter-topics" }
tempfile = "3"
