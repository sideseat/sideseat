[package]
name = "sideseat-adapter-sqlite"
version.workspace = true
license = "Apache-2.0"
publish = false
edition = "2024"
rust-version.workspace = true

[lints]
workspace = true

[features]
# Helpers that reach into the store the way a fault would - see `test_support`. Tests only.
test-support = []

[dependencies]
sideseat-core = { path = "../core" }
sideseat-ports = { path = "../ports" }
async-trait = { workspace = true }
chrono = { workspace = true }
cuid2 = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
sideseat-workspace-hack.workspace = true

[dev-dependencies]
tempfile = "3"

[package.metadata.cargo-machete]
# Present only to pin feature sets for cargo-hakari; nothing imports it.
ignored = ["sideseat-workspace-hack"]
