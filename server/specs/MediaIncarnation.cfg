\* One file, two collectors that pause and take each other's claims over, three ingests that associate, write, are
\* acknowledged and released, four incarnations, one backup restored once, and a server store lease lost and taken
\* again: 896,903 distinct states, no violation, with the collectors outliving the restore under the lease and its
\* drain. With Drain FALSE, TLC breaks AckedReadable: a pass that claimed before the loss deletes, once the fence
\* reopens, the bytes of the row the restore brought back. With Lease and CollectorsStopped both FALSE it breaks
\* AckedReadable whatever the naming; with CollectorsStopped TRUE instead, the procedure without a lease, it holds
\* (180,093 states). With Incarnations FALSE it breaks AckedReadable: a collector whose claim was taken over deletes,
\* late, the bytes of the file ingested again since. With Advance FALSE it breaks StoredNamesBelowNext: the
\* restored sequence issues again an incarnation the lost timeline's object is named by - but AckedReadable still
\* holds, since a name reissued for the same file holds the same bytes, so only a deletion loses data.
SPECIFICATION Spec

CONSTANTS
    Collectors = {c1, c2}
    Ingests = {i1, i2, i3}
    MaxIncarnation = 4
    Incarnations = TRUE
    Advance = TRUE
    CollectorsStopped = FALSE
    Lease = TRUE
    Drain = TRUE

INVARIANTS
    TypeOK
    AckedReadable
    StoredNamesBelowNext

SYMMETRY Symmetry

\* The incarnation bound stops a branch; a stopped branch is not a stuck protocol.
CHECK_DEADLOCK FALSE
