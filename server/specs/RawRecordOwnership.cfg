\* Two ingests of the same export racing each other and the reconciler, through a legal hold and a
\* backup and restore. The races between two reconcilers are RawRecordReconcilers.cfg's.
SPECIFICATION Spec

CONSTANTS
    Spans = {s1, s2}
    Ingests = {i1, i2}
    Reconcilers = {r1}
    MaxVer = 4
    WithHold = TRUE
    WithRestore = TRUE
    ReceiptPrecedence = TRUE
    AtomicDelete = TRUE
    WithCrash = TRUE

INVARIANTS
    TypeOK
    Covered
    Private
    Collected
    HeldIntact
    VersionsAreFiltered
    LaterReceiptWins
    Recoverable

\* Versions and queue entries are bounded so the state space is finite; a run
\* that reaches the bound simply stops exploring that branch.
CONSTRAINT
    StateBound

SYMMETRY Symmetry

\* A branch stopped by the bound, or every process finished, has no successor;
\* neither is a stuck protocol.
CHECK_DEADLOCK FALSE
