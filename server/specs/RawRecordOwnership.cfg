\* One delivery, redelivered after failures, against a crashing reconciler and a rewrite execution, on a
\* backend whose look and write are separate statements (ClickHouse): partial deletions and their rewrites,
\* retention moving both ways, repair, and the supersede purge. 1,417,220 distinct states.
SPECIFICATION Spec

CONSTANTS
    Spans = {s1, s2}
    Ingests = {i1}
    Rewriters = {w1}
    Reconcilers = {r1}
    MaxVer = 2
    WithHold = FALSE
    WithRestore = FALSE
    ReceiptPrecedence = TRUE
    WithCrash = TRUE
    AtomicWrites = FALSE
    Duplicates = FALSE
    Epochs = TRUE
    FencedLanding = TRUE

INVARIANTS
    TypeOK
    Covered
    Private
    Collected
    HeldIntact
    VersionsAreFiltered
    LaterReceiptWins
    Recoverable
    UnownedRowsUnacked
    OwnedRowsAboveDecisions
    NoLatestLost
    NoResurrectedRead

\* Versions and epochs are bounded so the state space is finite; a run that
\* reaches the bound simply stops exploring that branch.
CONSTRAINT
    StateBound

SYMMETRY Symmetry

\* A branch stopped by the bound, or every process finished, has no successor;
\* neither is a stuck protocol.
CHECK_DEADLOCK FALSE
