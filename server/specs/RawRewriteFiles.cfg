\* Three spans of one record, two rewriters that can read the same version and be keyed anywhere above it, a
\* repair keyed at the version it read, one reconciler pass, any of them crashing; deletions and a span ingested
\* again, the pass the append queued reconciling the files (`Derived` TRUE): 9,295,826 distinct states, no
\* violation, and 40,845,996 at a key bound of 5. With BasedOnCheck FALSE - a rewrite landing over a version it was
\* not prepared from - or KeyOnly TRUE - that version told apart by its key alone, which a repair at the same key
\* defeats - TLC breaks LatestMediaHeld: a rewrite brings back a span whose file a reconciliation released. With
\* AtomicQueue FALSE - the record queued after the append, in a step of its own, as ClickHouse does without a
\* landing fence - it breaks OwedNotLost: the rewrite crashes between the two and nothing is queued. With
\* ClearRead FALSE - a pass clearing every entry - it breaks OwedNotLost: a pass that reconciled before an append
\* clears the append's entry.
SPECIFICATION Spec

CONSTANTS
    Spans = {s1, s2, s3}
    Rewriters = {w1, w2}
    Passes = {p1}
    MaxKey = 4
    Derived = TRUE
    BasedOnCheck = TRUE
    KeyOnly = FALSE
    AtomicQueue = TRUE
    ClearRead = TRUE

INVARIANTS
    TypeOK
    LatestMediaHeld
    LiveFileKept
    OwedNotLost

SYMMETRY Symmetry

\* The key bound stops a branch; a stopped branch is not a stuck protocol.
CHECK_DEADLOCK FALSE
