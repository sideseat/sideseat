\* Three spans of one record, two rewriters that can read the same version and be keyed anywhere above it, a
\* repair keyed at the version it read, one reconciler pass, any of them crashing; deletions and a span ingested
\* again, with the rewrite reconciling its own files after its append (`Derived` FALSE): 70,785,156 distinct
\* states, no violation. With BasedOnCheck FALSE - a rewrite landing over a version it was not prepared from - or
\* KeyOnly TRUE - the version told apart by its key alone, which a repair at the same key defeats - TLC breaks
\* LatestMediaHeld: a rewrite brings back a span whose file a reconciliation released.
SPECIFICATION Spec

CONSTANTS
    Spans = {s1, s2, s3}
    Rewriters = {w1, w2}
    Passes = {p1}
    MaxKey = 6
    Derived = FALSE
    BasedOnCheck = TRUE
    KeyOnly = FALSE
    AtomicQueue = TRUE
    ClearRead = TRUE

INVARIANTS
    TypeOK
    LatestMediaHeld
    LiveFileKept
    OwedNotLost

SYMMETRY Symmetry

\* The key bound stops a branch; a stopped branch is not a stuck protocol.
CHECK_DEADLOCK FALSE
