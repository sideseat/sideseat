\* Bounded model for OrderGraph: three observations over two survivors.
\*
\* Three observations over two survivors: two copies of one message, so the answer
\* must not depend on which survives, plus a third observation that can land between
\* them. That completes in about half an hour over 82,944 distinct states.
\*
\* `Cohesion` is vacuous at this size and a larger model does not finish - see the
\* module header for why that is an acceptable trade rather than a gap.
\*
\* TLC enumerates every (lineage, carrier, position, call/result) assignment and
\* checks the properties on each, which is a bounded proof over all input shapes
\* rather than over the shapes the fixture corpus happens to contain.

