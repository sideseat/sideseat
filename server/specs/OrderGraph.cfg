\* Bounded model for OrderGraph: four observations over three survivors.
\*
\* Three survivors is the smallest model in which `Cohesion` can fail at all: with
\* two, there is no third block that could land between a contracted pair, so the
\* property is vacuous however the resolver behaves. Four observations then allow
\* two copies of one message - the answer must not depend on which survives - plus
\* carriers for an emission, a snapshot and accumulated state across two spans.
\*
\* TLC enumerates every (lineage, carrier, position, call/result) assignment and
\* checks the properties on each, which is a bounded proof over all input shapes
\* rather than over the shapes the fixture corpus happens to contain.

SPECIFICATION Spec

CONSTANTS
    ob1 = ob1
    ob2 = ob2
    ob3 = ob3
    ob4 = ob4
    sv1 = sv1
    sv2 = sv2
    sv3 = sv3
    none = none
    spA = spA
    spB = spB
    p1 = p1
    p2 = p2
    p3 = p3

\* Listed separately, so a violation names the property rather than the conjunction.
INVARIANTS
    TypeOK
    Permutation
    Cohesion
    AcyclicImpliesEdges
    AcyclicImpliesCausality
    AcyclicImpliesCarrier
    AcyclicImpliesDataflow
