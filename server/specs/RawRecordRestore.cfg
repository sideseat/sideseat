\* A backup taken quiescent and restored later, under a legal hold, on DuckDB's atomic look-and-write: both
\* stores roll back as one snapshot - owners, registrations, epoch, decisions and the deletion journal - the
\* payload is staged again and re-runs, and the hold's protection rebases to what came back. 2,622,898
\* distinct states.
SPECIFICATION Spec

CONSTANTS
    Spans = {s1}
    Ingests = {i1}
    Rewriters = {w1}
    Reconcilers = {r1}
    MaxVer = 2
    WithHold = TRUE
    WithRestore = TRUE
    ReceiptPrecedence = TRUE
    WithCrash = FALSE
    AtomicWrites = TRUE
    Duplicates = FALSE
    Epochs = TRUE

INVARIANTS
    TypeOK
    Covered
    Private
    Collected
    HeldIntact
    VersionsAreFiltered
    LaterReceiptWins
    Recoverable
    OwnersCoverRows
    NoLatestLost
    NoResurrectedRead

\* Versions and epochs are bounded so the state space is finite; a run that
\* reaches the bound simply stops exploring that branch.
CONSTRAINT
    StateBound

SYMMETRY Symmetry

\* A branch stopped by the bound, or every process finished, has no successor;
\* neither is a stuck protocol.
CHECK_DEADLOCK FALSE
