\* One file associated with one trace through a committed span and its raw record; three writers that associate
\* it, write a span naming it and confirm, or abort; retention deleting committed spans; a raw rewrite that stops
\* the record naming it; a retention sweep and a raw-record pass reconciling concurrently. A confirm draws its stamp and
\* applies it in two steps. `CheckFirst`: 3,367,163 distinct states, no violation, in about 16 s; with two sweeps,
\* which can claim one token, 192,171,429 in about 41 minutes, also clean, checked once. Its stamp, the larger-stamp
\* rule and its deferral are necessary, and the replaced `ReleaseFirst` and the intent-first alternative both lose
\* acknowledged media, each shown by its mutant.
SPECIFICATION Spec

CONSTANTS
    Writers = {w1, w2, w3}
    Sweeps = {k1}
    Passes = {q1}
    MaxToken = 4
    Protocol = "CheckFirst"
    Stamp = TRUE
    Defer = TRUE
    Max = TRUE

SYMMETRY Symmetry

INVARIANTS
    TypeOK
    NoMediaLost
    LiveFileKept
    OwedNotLost

\* The token bound stops a branch; a stopped branch is not a stuck protocol.
CHECK_DEADLOCK FALSE
