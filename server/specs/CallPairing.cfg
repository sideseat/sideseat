\* Bounded model for CallPairing: three executions, every assignment of ids (two, or none), two shapes, results
\* emitted or not, on their span or elsewhere, early or late, two contents, and a request recorded at any time with up
\* to two call copies and one result copy, with or without its id. Every state is initial, so TLC checks each
\* assignment once: 2,407,104 distinct states, in about three minutes, almost all of it enumerating them. Each
\* mutant in CallPairing.mutants breaks a property within seconds.

SPECIFICATION Spec

CONSTANTS
    NE = 3
    RankAmongShape = FALSE
    NoShapeCheck = FALSE
    FirstCandidate = FALSE
    CopiesConsume = FALSE

\* Listed separately, so a violation names the property rather than the conjunction.
INVARIANTS
    TypeOK
    ShapeSafety
    Matching
    FailureAccounting
    DeliveryInvariance
    Conservation
    CopiesCreateNothing
