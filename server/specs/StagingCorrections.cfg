\* StagingRetirement's run for the corrections of one metric datapoint: three revisions in the order they are
\* received, two consumers, power loss, and no record of an export's own, so a superseded export settles on the
\* later revision alone. With ReceiptPrecedence FALSE, TLC finds LaterReceiptWins broken by a copy written after
\* a correction received later.
SPECIFICATION Spec

CONSTANTS
    Payloads = {p1, p2, p3}
    Consumers = {c1, c2}
    Contents = {a, b}
    WithPowerLoss = TRUE
    ReceiptPrecedence = TRUE
    SharedContent = TRUE
    OwnRecord = FALSE
    MaxWrites = 3

INVARIANTS
    TypeOK
    NoSilentLoss
    NoFalseAnomaly
    CleanRunsAreClean
    LaterReceiptWins
    RetiredWasWritten
    RetiredIsAnswered

SYMMETRY Symmetry

\* Every export staged and every reference acknowledged has no successor; that is completion, not a stuck
\* protocol.
CHECK_DEADLOCK FALSE
