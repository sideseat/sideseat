\* Three exports, two consumers that can hold the same reference, and power loss that rolls back trailing
\* registrations after their references were published.
SPECIFICATION Spec

CONSTANTS
    Payloads = {p1, p2, p3}
    Consumers = {c1, c2}
    WithPowerLoss = TRUE

INVARIANTS
    TypeOK
    NoSilentLoss
    NoFalseAnomaly
    CleanRunsAreClean

\* Every export staged and every reference acknowledged has no successor; that is completion, not a stuck
\* protocol.
CHECK_DEADLOCK FALSE
