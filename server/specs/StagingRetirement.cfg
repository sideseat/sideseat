\* Three exports - revisions of one span, in the order they are received - two consumers that can hold the same
\* reference or write two revisions in either order, and power loss that rolls back trailing registrations after
\* their references were published. ReceiptPrecedence is the protocol as implemented; with it FALSE, TLC finds
\* LaterReceiptWins broken by a copy written after a revision received later. MaxWrites bounds the distinct
\* revisions stored; at one per payload it truncates nothing with ReceiptPrecedence, and bounds the runs without
\* it, where every write is a new instant.
SPECIFICATION Spec

CONSTANTS
    Payloads = {p1, p2, p3}
    Consumers = {c1, c2}
    WithPowerLoss = TRUE
    ReceiptPrecedence = TRUE
    MaxWrites = 3

INVARIANTS
    TypeOK
    NoSilentLoss
    NoFalseAnomaly
    CleanRunsAreClean
    LaterReceiptWins
    RetiredWasWritten

\* Every export staged and every reference acknowledged has no successor; that is completion, not a stuck
\* protocol.
CHECK_DEADLOCK FALSE
