\* One trace, two children naming a deleted session, a later-starting root naming a live one and a root naming none, written by four
\* instances concurrently with a deleter's cutoff, read, decision and tombstone, the grace two ticks on a four-tick clock.
\* With every guard on, LiveRootKept and NoLossUnderLiveRoot hold: 185,174 distinct states, in about three seconds. Each
\* guard's mutant breaks LiveRootKept.
SPECIFICATION Spec

CONSTANTS
    Grace = 2
    MaxTime = 4
    RootFirst = TRUE
    DecidingRoot = TRUE
    Gate = TRUE
    CutoffFirst = TRUE
    FenceOnRoot = TRUE
    PostWriteRooted = TRUE

INVARIANTS
    TypeOK
    LiveRootKept
    NoLossUnderLiveRoot

\* The clock's bound stops a branch; a stopped branch is not a stuck protocol.
CHECK_DEADLOCK FALSE
