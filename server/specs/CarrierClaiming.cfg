SPECIFICATION Spec

CONSTANTS
    Carriers = {1, 2, 3}
    Rules = {1, 2, 3, 4}

\* A configuration file cannot hold a TLA+ function expression, so the three
\* function-valued constants are substituted from definitions in the spec,
\* where the instance is described and its choices explained.
CONSTANTS
    Rank <- ModelRank
    Reads <- ModelReads
    ClaimOnly <- ModelClaimOnly

INVARIANTS
    TypeOK
    OneReaderPerCarrier
    ClaimTakesCarrier
    FallbackIsLastResort
    GreedyInRankOrder
    ComposedReadingsCanBeStarved
    OnlyEligibleOwn
    MoreCarriersOnlyAdd

\* `Done` is a genuine endpoint with no successor: every rule has been seen and
\* the fallback has run or was not needed. So "no further action possible" is
\* completion rather than a stuck evaluation.
CHECK_DEADLOCK FALSE
