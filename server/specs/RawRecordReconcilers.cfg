\* Three reconcilers racing one ingest and a rewrite execution on separate look-and-write statements, with
\* crashes: a decision purged by its collector, a takeover of the same decision, and a third collection in
\* flight, over partial deletions and rewrites. 15,589,306 distinct states.
SPECIFICATION Spec

CONSTANTS
    Spans = {s1, s2}
    Ingests = {i1}
    Rewriters = {w1}
    Reconcilers = {r1, r2, r3}
    MaxVer = 1
    WithHold = FALSE
    WithRestore = FALSE
    ReceiptPrecedence = TRUE
    WithCrash = TRUE
    AtomicWrites = FALSE
    Duplicates = FALSE
    Epochs = TRUE

INVARIANTS
    TypeOK
    Covered
    Private
    Collected
    HeldIntact
    VersionsAreFiltered
    LaterReceiptWins
    Recoverable
    OwnersCoverRows
    NoLatestLost
    NoResurrectedRead

\* Versions and epochs are bounded so the state space is finite; a run that
\* reaches the bound simply stops exploring that branch.
CONSTRAINT
    StateBound

SYMMETRY Symmetry

\* A branch stopped by the bound, or every process finished, has no successor;
\* neither is a stuck protocol.
CHECK_DEADLOCK FALSE
