\* Two reconcilers racing each other and one ingest, through a legal hold: the race in which one
\* reconciler's stale rewrite recreated a record the other had just deleted. Three spans, so a rewrite
\* prepared before a second deletion can win the version tie over the other reconciler's newer one.
SPECIFICATION Spec

CONSTANTS
    Spans = {s1, s2, s3}
    Ingests = {i1}
    Reconcilers = {r1, r2}
    MaxVer = 4
    WithHold = TRUE
    WithRestore = FALSE
    ReceiptPrecedence = TRUE
    AtomicDelete = TRUE
    WithCrash = TRUE

INVARIANTS
    TypeOK
    Covered
    Private
    Collected
    HeldIntact
    VersionsAreFiltered
    LaterReceiptWins
    Recoverable

\* Versions and queue entries are bounded so the state space is finite; a run
\* that reaches the bound simply stops exploring that branch.
CONSTRAINT
    StateBound

SYMMETRY Symmetry

\* A branch stopped by the bound, or every process finished, has no successor;
\* neither is a stuck protocol.
CHECK_DEADLOCK FALSE
