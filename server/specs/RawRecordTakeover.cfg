\* Two executions of one staged payload - redrive's duplicates, either of which can die once the other settled
\* - against two crashing reconcilers on separate look-and-write statements: a collection decided by one,
\* purged and dropped by a takeover, a stale landing resurrecting the record, and the confirm fence refusing
\* the doomed epoch. 6,198,250 distinct states. Add NeverResurrected to INVARIANTS and TLC prints a
\* stale-landing trace in seconds; remove the fence from Confirm and OwnedRowsAboveDecisions breaks, or set
\* Epochs = FALSE and NoLatestLost breaks - a late purge deletes the version an owned, in-retention row rests on.
SPECIFICATION Spec

CONSTANTS
    Spans = {s1}
    Ingests = {i1, i2}
    Rewriters = {}
    Reconcilers = {r1, r2}
    MaxVer = 1
    WithHold = FALSE
    WithRestore = FALSE
    ReceiptPrecedence = TRUE
    WithCrash = TRUE
    AtomicWrites = FALSE
    Duplicates = TRUE
    Epochs = TRUE
    FencedLanding = TRUE

INVARIANTS
    TypeOK
    Covered
    Private
    Collected
    HeldIntact
    VersionsAreFiltered
    LaterReceiptWins
    Recoverable
    UnownedRowsUnacked
    OwnedRowsAboveDecisions
    NoLatestLost
    NoResurrectedRead

\* Versions and epochs are bounded so the state space is finite; a run that
\* reaches the bound simply stops exploring that branch.
CONSTRAINT
    StateBound

SYMMETRY Symmetry

\* A branch stopped by the bound, or every process finished, has no successor;
\* neither is a stuck protocol.
CHECK_DEADLOCK FALSE
