[package]
name = "sideseat-server"
version.workspace = true
license = "Apache-2.0"
publish = false
edition = "2024"
rust-version.workspace = true

[[bin]]
name = "sideseat"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# Application layers
sideseat-core = { path = "crates/core" }
sideseat-ports = { path = "crates/ports" }
sideseat-domain = { path = "crates/domain" }
sideseat-messaging = { path = "crates/messaging" }
sideseat-ingestion = { path = "crates/ingestion" }
sideseat-query-sql = { path = "crates/query-sql" }
sideseat-api = { path = "crates/api" }

# Infrastructure adapters selected by the composition root
sideseat-adapter-blob-storage = { path = "crates/adapter-blob-storage" }
sideseat-adapter-cache = { path = "crates/adapter-cache" }
sideseat-adapter-clickhouse = { path = "crates/adapter-clickhouse" }
sideseat-adapter-duckdb = { path = "crates/adapter-duckdb" }
sideseat-adapter-postgres = { path = "crates/adapter-postgres" }
sideseat-adapter-pricing = { path = "crates/adapter-pricing" }
sideseat-adapter-registrations-memory = { path = "crates/adapter-registrations-memory" }
sideseat-adapter-secrets = { path = "crates/adapter-secrets" }
sideseat-adapter-sqlite = { path = "crates/adapter-sqlite" }
sideseat-adapter-topics = { path = "crates/adapter-topics" }

# Runtime and data
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
dotenvy = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
semver = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }

# Protocol and integration clients
opentelemetry-proto = { workspace = true }
prost = { workspace = true }
tonic = { workspace = true }
gcp_auth = { workspace = true }
clickhouse = { workspace = true }

# Provider connection checks
sideseat = { path = "../sdk/rust" }

# Footprint gates require a stable allocator. Supported targets use jemalloc;
# Windows uses its system allocator and reports that distinction at runtime.
[target.'cfg(not(target_os = "windows"))'.dependencies]
tikv-jemallocator = "0.7.0"

[dev-dependencies]
sideseat-domain = { path = "crates/domain", features = ["test-support"] }
sideseat-ingestion = { path = "crates/ingestion", features = ["test-support"] }
tempfile = "3"
# Keep compressed-fixture privacy checks cross-platform.
flate2 = "1"
memchr = "2"
