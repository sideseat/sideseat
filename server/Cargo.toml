[package]
name = "sideseat-server"
version.workspace = true
license = "Apache-2.0"
publish = false
edition = "2024"
rust-version.workspace = true

[[bin]]
name = "sideseat"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# The innermost layer, and the first compiler-enforced boundary: its manifest names no driver and
# nothing of SideSeat's own, so a violation does not compile rather than being caught by review.
sideseat-core = { path = "crates/core" }
sideseat-api = { path = "crates/api" }
sideseat-domain = { path = "crates/domain" }
sideseat-adapter-blob-storage = { path = "crates/adapter-blob-storage" }
sideseat-adapter-cache = { path = "crates/adapter-cache" }
sideseat-adapter-clickhouse = { path = "crates/adapter-clickhouse" }
sideseat-adapter-duckdb = { path = "crates/adapter-duckdb" }
sideseat-adapter-postgres = { path = "crates/adapter-postgres" }
sideseat-adapter-registrations-memory = { path = "crates/adapter-registrations-memory" }
sideseat-adapter-secrets = { path = "crates/adapter-secrets" }
sideseat-adapter-sqlite = { path = "crates/adapter-sqlite" }
sideseat-adapter-topics = { path = "crates/adapter-topics" }
# The ports: traits, DTOs, the filter vocabulary and the error type. Names no adapter and no driver.
sideseat-ports = { path = "crates/ports" }
sideseat-query-sql = { path = "crates/query-sql" }
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
dotenvy = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
rust-embed = { workspace = true }
reqwest = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
mime_guess = { workspace = true }
directories = { workspace = true }
dirs = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
local-ip-address = { workspace = true }
supports-hyperlinks = { workspace = true }
jsonwebtoken = { workspace = true }
rand = { workspace = true }
subtle = { workspace = true }
axum-extra = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }

# OpenTelemetry dependencies
opentelemetry-proto = { workspace = true }
prost = { workspace = true }
tonic = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
blake3 = { workspace = true }
serde_json_path = { workspace = true }
hmac = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
rustc-hash = { workspace = true }
validator = { workspace = true }
cuid2 = { workspace = true }
utoipa = { workspace = true }
semver = { workspace = true }

# Cloud provider SDKs still used by server-owned integrations
gcp_auth = { workspace = true }

# ClickHouse client
clickhouse = { workspace = true }

# MCP server
rmcp = { workspace = true }
schemars = { workspace = true }
tokio-util = { workspace = true }

# SideSeat SDK (for provider test-connection)
sideseat = { path = "../sdk/rust" }
ipnet = "2.12.1"

[features]
default = []

# The footprint gates are absolute megabyte figures, so they are only reproducible against a *pinned*
# allocator: glibc's malloc, macOS's magazine malloc and jemalloc each hold freed pages differently, and a
# ceiling measured under one says nothing about another. See `runtime/allocation.rs`.
#
# Target-scoped rather than feature-gated, because project convention forbids feature gates and because the
# choice is genuinely a property of the target: `tikv-jemalloc-sys` does not build for Windows. Windows
# therefore keeps the system allocator, and `allocation::ALLOCATOR_NAME` says so rather than letting a
# footprint number be read as comparable.
[target.'cfg(not(target_os = "windows"))'.dependencies]
tikv-jemallocator = "0.7.0"

[dev-dependencies]
sideseat-domain = { path = "crates/domain", features = ["test-support"] }
tempfile = "3"
proptest = "1"
# A real tokeniser for the structural sweeps, which read this crate's own source. `span-locations` is what lets
# a finding name a line. Line matching was a class of bypass rather than one: a brace inside a string literal
# sent the `#[cfg(test)]` stripper hunting for a close brace and it consumed the production items after it, and a
# name written as `concat!("lang",\n "graph")` was invisible because the pieces sit on different lines.
proc-macro2 = { version = "1", features = ["span-locations"] }
# So the privacy sweep can read a compressed replay archive. Shelling out to `gzip -dc` would make the check
# depend on a tool Windows does not ship, and a sweep that skips where the tool is missing is the shape this
# whole file exists to remove.
flate2 = "1"
memchr = "2"
